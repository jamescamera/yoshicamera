<style>
  :root{
    --void:#0C0D10;
    --card:#E7E4DB;
    --ink:#1A1A17;
    --ink-soft:#6a675d;
    --accent:#C9A227;
    --rule:rgba(26,26,23,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-user-select:none;user-select:none;
  }
  canvas.stage{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:2;}
  #gl{opacity:0;z-index:1;pointer-events:none;}
  video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}

  #hud{
    position:fixed;top:0;left:0;right:0;z-index:30;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 15px 12px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    pointer-events:none;
  }
  #hud .stack{text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #hud .n{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#F0EDE3;margin:0 0 3px;}
  #hud .sub{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(240,237,227,.6);margin:0;}
  #recDot{
    display:none;align-items:center;gap:7px;flex:none;
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#F0EDE3;
    background:rgba(12,13,16,.7);padding:5px 9px;border-radius:20px;
  }
  #recDot.on{display:flex;}
  #recDot i{width:7px;height:7px;border-radius:50%;background:#E5484D;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* pips showing where you are in the set */
  #quick{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);
    z-index:33;padding:0 14px;pointer-events:none;
  }
  #quick.off{display:none;}
  .qrow{display:flex;gap:12px;margin:0 0 8px;}
  .qs{flex:1 1 0;pointer-events:auto;background:rgba(12,13,16,.5);padding:6px 10px 2px;}
  .qs label{
    display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(240,237,227,.78);margin-bottom:1px;
  }
  .qs label b{font-weight:400;color:#F0EDE3;font-variant-numeric:tabular-nums;}
  .qs input[type=range]{height:22px;}
  .qs input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(240,237,227,.35);}
  .qs input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(240,237,227,.3);border-radius:3px;}
  .qs input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:19px;height:19px;margin-top:-8px;
    background:linear-gradient(to bottom,#FFFFFF,#B9B6AC);
    border:1px solid rgba(0,0,0,.45);border-radius:50%;
    box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .qs input[type=range]::-moz-range-track{height:1px;background:rgba(240,237,227,.35);}
  .qs input[type=range]::-moz-range-thumb{
    width:19px;height:19px;border-radius:50%;
    background:linear-gradient(to bottom,#FFFFFF,#B9B6AC);
    border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 4px rgba(0,0,0,.55);}
  .qchips{display:flex;gap:6px;justify-content:center;}
  .qchips button{
    pointer-events:auto;font:inherit;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:#F0EDE3;cursor:pointer;padding:9px 13px;border-radius:20px;
    background:linear-gradient(to bottom, rgba(58,60,66,.92), rgba(24,26,30,.92));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 2px 5px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13);
    transition:transform .08s, background .14s;
  }
  .qchips button:active{transform:translateY(1px);
    box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 2px 5px rgba(0,0,0,.45);}
  .qchips button.on{
    background:linear-gradient(to bottom, #E8C24E, var(--accent));
    color:var(--void);border-color:rgba(0,0,0,.35);
    box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);}
  #pips{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
    z-index:32;display:flex;justify-content:center;gap:6px;pointer-events:none;
  }
  #pips i{width:5px;height:5px;border-radius:50%;background:rgba(240,237,227,.3);transition:background .2s,transform .2s;}
  #pips i.on{background:var(--accent);transform:scale(1.5);}

  /* the lens itself, on the picture — only appears when the driver allows it */
  #lens{
    position:fixed;right:9px;top:50%;transform:translateY(-50%);
    z-index:34;display:none;flex-direction:column;align-items:center;gap:7px;
    pointer-events:none;
  }
  #lens.on{display:flex;}
  #lens .zv{
    font-size:9px;letter-spacing:.1em;color:#F0EDE3;font-variant-numeric:tabular-nums;
    background:rgba(12,13,16,.62);padding:4px 7px;border-radius:11px;
    border:1px solid rgba(255,255,255,.12);
  }
  #lens button{
    pointer-events:auto;font:inherit;font-size:10.5px;letter-spacing:.01em;
    color:#F0EDE3;cursor:pointer;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(to bottom, rgba(58,60,66,.92), rgba(24,26,30,.92));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 2px 5px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13);
    transition:transform .08s, background .14s;
  }
  #lens button:active{transform:scale(.94);}
  #lens button.on{
    background:linear-gradient(to bottom, #E8C24E, var(--accent));
    color:var(--void);border-color:rgba(0,0,0,.35);
    box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);
  }
  #lens button.tor{font-size:16px;margin-top:4px;}
  @media (max-height:620px){ #lens button{width:36px;height:36px;font-size:9.5px;} }

  #deck{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 20px);
    display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none;
  }
  #deck > *{pointer-events:auto;}
  .tab{
    font:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    background:var(--card);color:var(--ink);border:0;padding:11px 13px;cursor:pointer;min-width:74px;
    box-shadow:0 4px 16px rgba(0,0,0,.55);
  }
  .tab.on{background:var(--accent);color:var(--void);}
  #bShot{
    width:72px;height:72px;border-radius:50%;flex:none;cursor:pointer;padding:0;
    background:var(--card);border:3px solid rgba(12,13,16,.6);
    box-shadow:0 5px 22px rgba(0,0,0,.6), inset 0 0 0 3px rgba(231,228,219,.95);
    transition:transform .1s;
  }
  #bShot:active{transform:scale(.92);}
  #bShot.busy{background:#9a978d;}
  #bRec{
    width:52px;height:52px;border-radius:50%;flex:none;cursor:pointer;padding:0;position:relative;
    background:rgba(12,13,16,.5);border:2px solid rgba(231,228,219,.9);transition:transform .1s;
  }
  #bRec:after{
    content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:#E5484D;transition:all .18s;
  }
  #bRec.on:after{width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:3px;}
  #bRec:active{transform:scale(.92);}

  #scrim{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:44;background:rgba(12,13,16,.12);
    opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
  }
  #scrim.on{opacity:1;visibility:visible;}
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:46;max-height:42vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:rgba(231,228,219,.9);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.25,1), opacity .18s;
    box-shadow:0 -10px 34px rgba(0,0,0,.6);
  }
  #sheet.on{transform:translateY(0);}
  #sheet:before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(to right,#C9A227 0 12%,#2E5FA3 12% 24%,#8C3B2E 24% 36%,
      #3F6E4B 36% 48%,#7A5EA8 48% 60%,#B8791E 60% 72%,#2A2A28 72% 84%,#D8D5CC 84% 100%);
    opacity:.8;
  }

  /* the rack of instruments */
  #rack{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin:0 0 4px;}
  #rack::-webkit-scrollbar{display:none;}
  #rack button{
    font:inherit;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto;
    color:var(--ink);border:1px solid rgba(26,26,23,.28);border-radius:20px;padding:9px 13px;cursor:pointer;
    background:linear-gradient(to bottom,#FFFDF7,#DFDBD0);
    box-shadow:0 1px 2px rgba(26,26,23,.2), inset 0 1px 0 rgba(255,255,255,.9);
  }
  #rack button:active{transform:translateY(1px);}
  #rack button.on{
    background:linear-gradient(to bottom,#E8C24E,var(--accent));color:var(--void);
    border-color:rgba(0,0,0,.3);}

  .seclabel{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 2px;}
  #hw .qs{background:transparent;padding:0;}
  #hw .qs label{color:var(--ink-soft);}
  #hw .qs label b{color:var(--ink);}
  #hw .qchips button{background:linear-gradient(to bottom,#FFFDF7,#DFDBD0);color:var(--ink);
    border:1px solid rgba(26,26,23,.3);}
  #hw .qchips button.on{background:linear-gradient(to bottom,#E8C24E,var(--accent));color:var(--void);}
  #camName{font-size:15px;font-weight:700;letter-spacing:.03em;margin:8px 0 2px;}
  #camLine{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px;}
  .hr{height:1px;background:var(--rule);margin:12px 0 0;}

  .row{display:flex;gap:5px;flex-wrap:wrap;}
  button.b{
    font:inherit;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);
    border:1px solid rgba(26,26,23,.3);border-radius:7px;padding:10px 6px;cursor:pointer;
    flex:1 1 22%;min-width:0;
    background:linear-gradient(to bottom,#FFFDF7,#DFDBD0);
    box-shadow:0 1px 2px rgba(26,26,23,.22), inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .08s, background .14s, color .14s;
  }
  button.b:active{transform:translateY(1px);
    background:linear-gradient(to bottom,#D6D2C6,#E9E5DA);
    box-shadow:inset 0 2px 4px rgba(26,26,23,.28);}
  button.b.on{
    background:linear-gradient(to bottom,#2E2E2A,#171714);color:var(--accent);
    border-color:#12120F;
    box-shadow:0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .grid2{display:flex;flex-wrap:wrap;gap:0 18px;}
  .field{margin:14px 0 0;flex:1 1 190px;}
  .field > label{
    display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
  }
  .field > label b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .note{font-size:9px;letter-spacing:.09em;line-height:1.8;color:var(--ink-soft);margin:14px 0 0;text-transform:uppercase;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;display:block;}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule);}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(26,26,23,.2);border-radius:3px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-10px;
    background:linear-gradient(to bottom,#FFFDF7,#CFCBBF);
    border:1px solid rgba(26,26,23,.42);border-radius:50%;
    box-shadow:0 2px 4px rgba(26,26,23,.35), inset 0 1px 0 rgba(255,255,255,.95);
  }
  input[type=range]::-moz-range-track{height:1px;background:var(--rule);}
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(to bottom,#FFFDF7,#CFCBBF);
    border:1px solid rgba(26,26,23,.42);
    box-shadow:0 2px 4px rgba(26,26,23,.35);}
  .seg{
    display:flex;border:1px solid rgba(26,26,23,.28);border-radius:8px;overflow:hidden;
    background:linear-gradient(to bottom,#D9D5C9,#EDE9DF);
    box-shadow:inset 0 2px 4px rgba(26,26,23,.18);
  }
  .seg button{
    border:0;border-right:1px solid rgba(26,26,23,.16);flex:1 1 0;padding:10px 3px;border-radius:0;
    background:transparent;box-shadow:none;
  }
  .seg button:last-child{border-right:0;}
  .seg button.on{
    border-radius:0;
    background:linear-gradient(to bottom,#2E2E2A,#171714);
    box-shadow:0 1px 3px rgba(0,0,0,.35);}

  .credit{
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:16px 0 0;padding-top:14px;
    border-top:1px solid var(--rule);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  }
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;opacity:.75;}
  .credit span{opacity:.55;}

  #gate{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--void);
    display:flex;align-items:center;justify-content:center;padding:30px;
  }
  #gate .card{background:var(--card);padding:26px 26px 24px;max-width:340px;width:100%;position:relative;}
  #gate .card:before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(to right,#C9A227 0 12%,#2E5FA3 12% 24%,#8C3B2E 24% 36%,
      #3F6E4B 36% 48%,#7A5EA8 48% 60%,#B8791E 60% 72%,#2A2A28 72% 84%,#D8D5CC 84% 100%);
    opacity:.8;
  }
  #gate h1{font-size:15px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;margin:14px 0 10px;}
  #gate p{font-size:10px;line-height:1.9;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 18px;text-transform:uppercase;}
  #gate button{width:100%;flex:none;padding:12px;font-size:10px;border:1px solid var(--ink);}
  #err{margin-top:13px;font-size:10px;line-height:1.7;color:#B4472B;letter-spacing:.03em;text-transform:none;display:none;}

  #flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:50;}
  #hint{
    position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);z-index:43;
    display:none;align-items:center;justify-content:center;gap:16px;pointer-events:none;
  }
  #hint.on{display:flex;animation:hintIn .4s ease-out;}
  #hint .harrow{
    font-size:30px;line-height:1;color:#F0EDE3;text-shadow:0 2px 10px rgba(0,0,0,.9);
    animation:nudge 1.5s ease-in-out infinite;
  }
  #hint .harrow:last-child{animation-delay:.75s;}
  #hint .hlabel{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#F0EDE3;
    background:rgba(12,13,16,.72);padding:11px 16px;border-radius:24px;
    box-shadow:0 4px 18px rgba(0,0,0,.6);
  }
  @keyframes nudge{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(-7px);opacity:1}}
  @keyframes hintIn{from{opacity:0}to{opacity:1}}
  #toast{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);z-index:55;
    background:rgba(12,13,16,.92);color:var(--card);font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;padding:9px 14px;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:82%;text-align:center;
  }
  #toast.on{opacity:1;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  @media (min-width:760px){
    #sheet{left:auto;right:20px;bottom:20px;width:440px;max-height:80vh;transform:translateY(120%);}
    #sheet.on{transform:translateY(0);}
  }

  /* =====================================================================
     LIQUID GLASS POLISH — deliberately CSS-first so the camera engines,
     recording path and WebKit/Android safeguards remain untouched.
     ===================================================================== */
  :root{
    --glass:rgba(244,242,236,.16);
    --glass-strong:rgba(244,242,236,.28);
    --glass-line:rgba(255,255,255,.36);
    --glass-shadow:0 14px 38px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.24);
    --accent-rgb:201,162,39;
  }
  html{color-scheme:dark;overscroll-behavior:none;}
  body{-webkit-touch-callout:none;overscroll-behavior:none;background:#08090C;}
  button,input{font:inherit;}
  button{position:relative;isolation:isolate;}
  button:disabled{opacity:.46;cursor:default;}

  #hud{padding-left:max(15px,env(safe-area-inset-left,0px));padding-right:max(15px,env(safe-area-inset-right,0px));}
  #hud .stack{
    padding:8px 10px 7px;border-radius:17px;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(18,19,24,.22));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 5px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  }
  #recDot{
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(9,10,14,.48));
    box-shadow:0 5px 18px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(14px) saturate(1.35);backdrop-filter:blur(14px) saturate(1.35);
  }

  #quick{
    left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
    padding:10px 12px 9px;border:1px solid var(--glass-line);border-radius:25px;
    background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(15,16,21,.28));
    box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:blur(22px) saturate(1.55);backdrop-filter:blur(22px) saturate(1.55);
    transition:opacity .22s,transform .28s cubic-bezier(.2,.8,.25,1);
  }
  .qrow{gap:16px;margin-bottom:7px;}
  .qs{background:transparent;padding:1px 3px 0;}
  .qs label{font-weight:600;text-shadow:0 1px 5px rgba(0,0,0,.6);}
  .qchips{gap:7px;}
  .qchips button{
    min-height:38px;padding:8px 13px;border-radius:19px;
    background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(16,17,22,.34));
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 4px 11px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18);
  }
  .qchips button.on{
    background:linear-gradient(155deg,rgba(var(--accent-rgb),.92),rgba(var(--accent-rgb),.58));
    color:#fff;border-color:rgba(255,255,255,.3);

<script>
(function(){
  "use strict";

  /* =====================================================================
     SHELL — camera, deck, sheet, recording. Shared by every instrument.
     ===================================================================== */
  var vid   = document.getElementById('vid');
  var stage = document.getElementById('stage');
  var ctx   = stage.getContext('2d');
  var glc   = document.getElementById('gl');
  var gate  = document.getElementById('gate');
  var errEl = document.getElementById('err');
  var flash = document.getElementById('flash');
  var sheet = document.getElementById('sheet');
  var scrim = document.getElementById('scrim');
  var toastEl = document.getElementById('toast');
  var hName = document.getElementById('hName');
  var hSub  = document.getElementById('hSub');
  var rackEl= document.getElementById('rack');
  var ctrlEl= document.getElementById('ctrls');
  var pipsEl= document.getElementById('pips');

  var W=0,H=0,DPR=1;
  var facing='user', stream=null, ready=false, held=false;

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||

  var now = function(){
    return (window.performance && performance.now) ? performance.now() : Date.now();
  };

  function has(op){
    var c=document.createElement('canvas').getContext('2d');
    c.globalCompositeOperation=op;
    return c.globalCompositeOperation===op;
  }
  var canMultiply=has('multiply'), canDifference=has('difference'), canScreen=has('screen'), canHue=has('hue');

  var toastT=null;
  function toast(m){
    toastEl.textContent=m; toastEl.className='on';

  }
  function commas(n){
    var s=String(n),o='',i,c=0;
    for(i=s.length-1;i>=0;i--){ o=s.charAt(i)+o; if(++c%3===0&&i>0) o=','+o; }
    return o;
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }   // Prism calls this and it was never defined
  function rand(a,b){ return a+Math.random()*(b-a); }
  function hash2(a,b){ var x=Math.sin(a*127.1+b*311.7+19.19)*43758.5453123; return x-Math.floor(x); }

  var LOW_MEMORY=IS_ANDROID && !!navigator.deviceMemory && navigator.deviceMemory<=4;
  function glyphLimit(n){ return Math.max(160,Math.round(n*(LOW_MEMORY?.68:1))); }

  function mk(w,h){
    var c=document.createElement('canvas');
    if(w){ c.width=w; c.height=h; }
    return { c:c, x:c.getContext('2d') };
  }

  /* pull a mirrored, cover-cropped frame into any surface */
  function grabInto(o, w, h){
    if(!vid.videoWidth) return false;
    if(o.c.width!==w || o.c.height!==h){ o.c.width=w; o.c.height=h; }
    var vw=vid.videoWidth, vh=vid.videoHeight;
    var vr=vw/vh, cr=w/h, ax=0, ay=0, aw=vw, ah=vh;
    if(vr>cr){ aw=vh*cr; ax=(vw-aw)/2; } else { ah=vw/cr; ay=(vh-ah)/2; }

    o.x.globalCompositeOperation='source-over';
    o.x.globalAlpha=1;
    if(facing==='user'){ o.x.translate(w,0); o.x.scale(-1,1); }
    o.x.drawImage(vid, ax,ay,aw,ah, 0,0,w,h);

  }

  /* stretch whatever light is in the room across the full range */
  function makeLeveller(){
    var lo=0, hi=255, on=false, hist=new Int32Array(64);
    return {
      lo:function(){ return lo; },
      hi:function(){ return hi; },
      read:function(px,n){
        var i,o,l,k,cum,t,a=0,b=255;
        for(k=0;k<64;k++) hist[k]=0;
        for(i=0;i<n;i++){

          hist[l>>2]++;

        t=n*0.04; cum=0;
        for(k=0;k<64;k++){ cum+=hist[k]; if(cum>=t){ a=k*4; break; } }
        t=n*0.04; cum=0;
        for(k=63;k>=0;k--){ cum+=hist[k]; if(cum>=t){ b=k*4+3; break; } }
        if(b-a<24) b=a+24;
        if(b>255){ b=255; a=231; }
        if(!on){ lo=a; hi=b; on=true; } else { lo=lo*0.9+a*0.1; hi=hi*0.9+b*0.1; }
      }
    };
  }

  /* =====================================================================
     THE INSTRUMENTS
     ===================================================================== */
  var CAMS=[];
  function reg(o){ CAMS.push(o); }

  /* ---------------- GAMUT — every colour, exactly once ---------------- */
  (function(){
    function axesToTranspose(X,b){
      var n=3,M=1<<(b-1),P,Q,t,i;
      for(Q=M;Q>1;Q>>=1){ P=Q-1;
        for(i=0;i<n;i++){
          if(X[i]&Q){ X[0]^=P; } else { t=(X[0]^X[i])&P; X[0]^=t; X[i]^=t; }
        }
      }
      for(i=1;i<n;i++) X[i]^=X[i-1];
      t=0;
      for(Q=M;Q>1;Q>>=1){ if(X[n-1]&Q) t^=Q-1; }
      for(i=0;i<n;i++) X[i]^=t;
      return X;
    }
    function transposeToAxes(X,b){
      var n=3,N=2<<(b-1),P,Q,t,i;
      t=X[n-1]>>1;
      for(i=n-1;i>0;i--) X[i]^=X[i-1];
      X[0]^=t;
      for(Q=2;Q!==N;Q<<=1){ P=Q-1;
        for(i=n-1;i>=0;i--){
          if(X[i]&Q){ X[0]^=P; } else { t=(X[0]^X[i])&P; X[0]^=t; X[i]^=t; }
        }
      }
      return X;
    }
    function tIdx(X,b){ var d=0,i,j; for(i=b-1;i>=0;i--) for(j=0;j<3;j++) d=d*2+((X[j]>>>i)&1); return d; }
    function idxT(d,b){
      var X=[0,0,0],i,j,p;
      for(i=b-1;i>=0;i--) for(j=0;j<3;j++){ p=3*b-1-((b-1-i)*3+j); X[j]|=((d>>>p)&1)<<i; }
      return X;
    }
    function hIndex(x,y,z,b){ return tIdx(axesToTranspose([x,y,z],b),b); }
    function hPoint(d,b){ return transposeToAxes(idxT(d,b),b); }
    function d2xy(side,d){
      var rx,ry,ss,t=d,x=0,y=0,tmp;
      for(ss=1;ss<side;ss*=2){
        rx=1&(t>>1); ry=1&(t^rx);
        if(ry===0){ if(rx===1){ x=ss-1-x; y=ss-1-y; } tmp=x; x=y; y=tmp; }
        x+=ss*rx; y+=ss*ry; t=Math.floor(t/4);
      }
      return [x,y];
    }

    /* ── how the pixels are walked ─────────────────────────────────
       Where the picture is completely flat — a blown-out window, sky — every
       pixel has the same key, so the walk alone decides what happens, and
       whatever shape the walk has gets printed straight into the picture.
       A Hilbert curve keeps neighbours together better than anything else,
       but it is built by halving squares, so its seams land on a 16, 32,
       64 pixel grid and a flat area comes out as visible squares.
       Turning the curve 31 degrees fixes that: the seams still exist but
       they run at an angle that lines up with nothing, so they read as
       soft mottling instead of tiles. Measured on a flat frame, this took
       the excess colour step on the 16px lines from 6.6x down to 1.0x, for
       about a third more roughness overall. */
    var ordCache=null, ordKey='';
    function hilbertD(side,x,y){
      var rx,ry,s,t,d=0;
      for(s=side>>1; s>0; s>>=1){
        rx=(x&s)>0?1:0;
        ry=(y&s)>0?1:0;
        d+=s*s*((3*rx)^ry);
        if(ry===0){
          if(rx===1){ x=side-1-x; y=side-1-y; }
          t=x; x=y; y=t;
        }
      }
      return d;
    }
    var TURN_C=Math.cos(0.5411), TURN_S=Math.sin(0.5411);   /* 31 degrees */
    function coherentOrder(w,h){
      var ck=w+'x'+h;
      if(ordKey===ck && ordCache) return ordCache;
      var side=1, need=w+h;
      while(side<need) side<<=1;
      var off=side>>1, cx=w/2, cy=h/2, top=side-1;
      var n=w*h, keys=new Int32Array(n), i=0, x, y, dx, dy, xr, yr;
      for(y=0;y<h;y++){
        dy=y-cy;
        for(x=0;x<w;x++){
          dx=x-cx;
          xr=Math.round(dx*TURN_C-dy*TURN_S)+off;
          yr=Math.round(dx*TURN_S+dy*TURN_C)+off;
          if(xr<0)xr=0; else if(xr>top)xr=top;
          if(yr<0)yr=0; else if(yr>top)yr=top;
          keys[i++]=hilbertD(side,xr,yr);
        }

      ordCache=radix(keys,n,8,4);
      ordKey=ck;
      return ordCache;
    }

    /* ── what the sort listens to ──────────────────────────────────────
       Clump keys the sort off a softened copy of the frame while the
       palette still lands on the real pixels. Neighbours then rank
       together, so grain stops being ranked as if it were detail.
       Every colour is still spent exactly once. */
    var blurA=null, blurB=null;
    function clumpK(max){
      if(v.clump<=0) return 1;
      return 1+Math.round((v.clump/100)*(max-1));
    }
    /* Push keys the sort off local contrast instead of the plain picture:
       subtract a wide blur and every small patch gets the run of the whole
       palette, so texture that was one flat colour comes apart into all of
       it. The wide blur has to be much wider than Clump's. */
    function pushK(max){
      if(v.push<=0) return 1;
      return Math.max(2, Math.round(4+(v.push/100)*(max-4)));
    }
    function pushed(base, wide, o, c){
      if(!wide) return base;
      var p=v.push/100, det=(base-wide[o+c])*(1+2*p);
      return base*(1-p) + p*(128+det);
    }
    /* live view: shrink only, and read the key off the small copy —
       one small readback per frame instead of a second full-size one */
    function softSmall(srcCan,w,h,k){
      if(k<=1) return null;
      var sw=Math.ceil(w/k), sh=Math.ceil(h/k);
      if(!blurA) blurA=mk();
      if(blurA.c.width!==sw || blurA.c.height!==sh){ blurA.c.width=sw; blurA.c.height=sh; }
      blurA.x.imageSmoothingEnabled=true;
      blurA.x.clearRect(0,0,sw,sh);
      blurA.x.drawImage(srcCan,0,0,sw,sh);
      return { d:blurA.x.getImageData(0,0,sw,sh).data, w:sw, h:sh };
    }
    /* shutter: shrink then grow back, so the key is smooth, not blocky */
    function softCopy(srcCan,w,h,k){
      if(k<=1) return null;
      var s=softSmall(srcCan,w,h,k);
      if(!s) return null;
      if(!blurB) blurB=mk();
      blurB.c.width=w; blurB.c.height=h;
      blurB.x.imageSmoothingEnabled=true;
      blurB.x.drawImage(blurA.c,0,0,w,h);
      return blurB.x.getImageData(0,0,w,h).data;
    }
    function dropSoft(){
      if(blurA){ blurA.c.width=1; blurA.c.height=1; }
      if(blurB){ blurB.c.width=1; blurB.c.height=1; }
    }

    var LUTS={}, small=null, keys=null, outImg=null, pal=null, palOrdered=null, palN=0, gw=0, gh=0;
    var NS=64, noiseTile=null, noiseKind='';
    var plateCan=null, plateRot=0, PS=256;
    var v={ order:'hilbert', dither:'blue', view:'camera', boil:'still',
            grain:220, fid:0, agit:16, clump:25, push:0 };

    function lutFor(mode){
      if(LUTS[mode]) return LUTS[mode];
      var L=new Int32Array(262144), r,g,b,mx,mn,h2,dd;
      if(mode==='hilbert'){
        for(r=0;r<64;r++) for(g=0;g<64;g++) for(b=0;b<64;b++)
          L[(r<<12)|(g<<6)|b]=hIndex(r,g,b,6);
      } else if(mode==='luma'){
        for(r=0;r<64;r++) for(g=0;g<64;g++) for(b=0;b<64;b++)
          L[(r<<12)|(g<<6)|b]=Math.round((0.2126*r+0.7152*g+0.0722*b)*4095/63)*64 + ((r+b)&63);
      } else {
        for(r=0;r<64;r++) for(g=0;g<64;g++) for(b=0;b<64;b++){
          mx=Math.max(r,Math.max(g,b)); mn=Math.min(r,Math.min(g,b)); h2=0;
          if(mx!==mn){
            dd=mx-mn;
            if(mx===r) h2=((g-b)/dd+6)%6;
            else if(mx===g) h2=(b-r)/dd+2;
            else h2=(r-g)/dd+4;
            h2=h2/6;
          }
          L[(r<<12)|(g<<6)|b]=Math.round(h2*4094)*64 + Math.round(0.2126*r+0.7152*g+0.0722*b);
        }
      }
      LUTS[mode]=L;
      return L;
    }
    function keyExact(r,g,b,mode){
      if(mode==='hilbert') return hIndex(r,g,b,8);
      if(mode==='luma') return Math.round((0.2126*r+0.7152*g+0.0722*b)*257)*64 + ((r+b)&63);
      var mx=Math.max(r,Math.max(g,b)), mn=Math.min(r,Math.min(g,b)), h2=0, dd;
      if(mx!==mn){
        dd=mx-mn;
        if(mx===r) h2=((g-b)/dd+6)%6;
        else if(mx===g) h2=(b-r)/dd+2;
        else h2=(r-g)/dd+4;
        h2=h2/6;
      }
      return Math.round(h2*65000)*256 + Math.round(0.2126*r+0.7152*g+0.0722*b);
    }

    function bayerTile(){
      var m=[[0]],k,ss,nm,x,y,val;
      for(k=0;k<3;k++){
        ss=m.length; nm=[];
        for(y=0;y<ss*2;y++) nm.push(new Array(ss*2));
        for(y=0;y<ss;y++) for(x=0;x<ss;x++){
          val=m[y][x]*4;
          nm[y][x]=val; nm[y][x+ss]=val+2; nm[y+ss][x]=val+3; nm[y+ss][x+ss]=val+1;
        }
        m=nm;
      }
      var t=new Float32Array(NS*NS);
      for(y=0;y<NS;y++) for(x=0;x<NS;x++) t[y*NS+x]=m[y&7][x&7]/64-0.5;
      return t;
    }
    function whiteTile(){
      var t=new Float32Array(NS*NS),i;
      for(i=0;i<t.length;i++) t[i]=Math.random()-0.5;
      return t;
    }
    /* Ulichney void-and-cluster — real blue noise, low frequencies suppressed */
    function blueTile(){
      var S=NS, N=S*S, i, j, rank;
      var E=new Float64Array(N), Pt=new Uint8Array(N), D=new Int32Array(N);
      var sig=1.5, R=4, K=[], dx, dy;
      for(dy=-R;dy<=R;dy++) for(dx=-R;dx<=R;dx++)
        K.push([dx,dy,Math.exp(-(dx*dx+dy*dy)/(2*sig*sig))]);
      function bump(pp,sc){
        var x=pp%S, y=(pp/S)|0, k, o, nx, ny;
        for(k=0;k<K.length;k++){
          o=K[k]; nx=(x+o[0]+S)%S; ny=(y+o[1]+S)%S;
          E[ny*S+nx]+=sc*o[2];
        }
      }
      function tightest(){ var b=-1,bv=-Infinity,q; for(q=0;q<N;q++) if(Pt[q]&&E[q]>bv){bv=E[q];b=q;} return b; }
      function voidest(){ var b=-1,bv=Infinity,q; for(q=0;q<N;q++) if(!Pt[q]&&E[q]<bv){bv=E[q];b=q;} return b; }
      var M=Math.round(N*0.1), pool=[], t;
      for(i=0;i<N;i++) pool.push(i);
      for(i=N-1;i>0;i--){ j=(Math.random()*(i+1))|0; t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
      for(i=0;i<M;i++){ Pt[pool[i]]=1; bump(pool[i],1); }
      for(i=0;i<N;i++){
        var c=tightest(); Pt[c]=0; bump(c,-1);
        var vd=voidest();
        if(vd===c){ Pt[c]=1; bump(c,1); break; }
        Pt[vd]=1; bump(vd,1);
      }
      var sP=new Uint8Array(Pt), sE=new Float64Array(E);
      for(rank=M-1;rank>=0;rank--){ var c2=tightest(); Pt[c2]=0; bump(c2,-1); D[c2]=rank; }
      Pt=sP; E=sE;
      for(rank=M;rank<N;rank++){ var v2=voidest(); Pt[v2]=1; bump(v2,1); D[v2]=rank; }
      var out=new Float32Array(N);
      for(i=0;i<N;i++) out[i]=D[i]/(N-1)-0.5;
      return out;
    }
    function tileFor(kind){
      if(noiseKind===kind && noiseTile) return noiseTile;
      noiseTile = (kind==='ordered') ? bayerTile() : (kind==='white' ? whiteTile() : blueTile());
      noiseKind=kind;
      return noiseTile;
    }
    function ditherAmt(){
      if(v.dither==='off' || v.agit<=0) return 0;
      return Math.pow(v.agit/100,1.5)*70;
    }

    function radix(k,n,bits,passes,init){
      var order=new Int32Array(n), tmp=new Int32Array(n);
      var B=1<<bits, mask=B-1, cnt=new Int32Array(B), i,p,sh,c,sum,t,q;
      if(init && init.length===n) order.set(init);
      else for(i=0;i<n;i++) order[i]=i;
      for(p=0;p<passes;p++){
        sh=p*bits;
        for(c=0;c<B;c++) cnt[c]=0;
        for(i=0;i<n;i++) cnt[(k[order[i]]>>>sh)&mask]++;
        sum=0; for(c=0;c<B;c++){ t=cnt[c]; cnt[c]=sum; sum+=t; }
        for(i=0;i<n;i++){ q=(k[order[i]]>>>sh)&mask; tmp[cnt[q]++]=order[i]; }
        order.set(tmp);
      }
      return order;
    }
    function buildPalette(n){
      var p=new Int32Array(n), i, st=16777216/n, pt;
      for(i=0;i<n;i++){ pt=hPoint(Math.floor(i*st),8); p[i]=(pt[0]<<16)|(pt[1]<<8)|pt[2]; }
      return p;
    }
    function orderPalette(p,mode){
      var n=p.length,i;
      if(mode==='hilbert') return p;
      var idx=new Array(n), ks=new Float64Array(n), c;
      for(i=0;i<n;i++){ c=p[i]; ks[i]=keyExact((c>>16)&255,(c>>8)&255,c&255,mode); idx[i]=i; }
      idx.sort(function(a2,b2){ return ks[a2]-ks[b2]; });
      var out=new Int32Array(n);
      for(i=0;i<n;i++) out[i]=p[idx[i]];
      return out;
    }

    function build(){
      gw=v.grain;
      gh=Math.max(8, Math.round(gw*(H/Math.max(W,1))));
      var n=gw*gh;
      if(!small) small=mk();
      small.c.width=gw; small.c.height=gh;
      outImg=small.x.createImageData(gw,gh);
      keys=new Int32Array(n);
      pal=buildPalette(n);
      palN=n;
      palOrdered=orderPalette(pal,v.order);
      lutFor(v.order);
      if(v.dither!=='off') tileFor(v.dither);
    }
    function reorder(){ if(pal) palOrdered=orderPalette(pal,v.order); lutFor(v.order); }

    function drawPlate(){
      if(!plateCan) plateCan=mk(PS,PS);
      var n=PS*PS, img=plateCan.x.createImageData(PS,PS), d=img.data;
      var k, xy, o, st=16777216/n, pt;
      for(k=0;k<n;k++){
        pt=hPoint(Math.floor(((k+plateRot)%n)*st),8);
        xy=d2xy(PS,k);
        o=(xy[1]*PS+xy[0])*4;
        d[o]=pt[0]; d[o+1]=pt[1]; d[o+2]=pt[2]; d[o+3]=255;
      }
      plateCan.x.putImageData(img,0,0);
      var side=Math.min(stage.width,stage.height);
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,stage.width,stage.height);
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(plateCan.c,(stage.width-side)/2,(stage.height-side)/2,side,side);
      if(!held) plateRot=(plateRot+61)%n;
      hSub.textContent=commas(n)+' colours · the plate, unrolled';
    }

    /* the shutter develops a far larger frame than the screen shows */
    function develop(){
      var btn=document.getElementById('bShot');
      btn.className='busy';
      toast('Developing…');
      setTimeout(function(){
        try{
          var aspect=H/Math.max(W,1);
          var bw=Math.round(Math.min(1100,Math.max(400,v.grain*5)));
          var bh=Math.round(bw*aspect);
          var n=bw*bh, kk;
          if(n>2200000){ kk=Math.sqrt(2200000/n); bw=Math.round(bw*kk); bh=Math.round(bh*kk); n=bw*bh; }
          var big=mk(bw,bh);
          if(!grabInto(big,bw,bh)) throw new Error('no frame');
          var img=big.x.getImageData(0,0,bw,bh), src=img.data;
          var wide=(v.push>0)?softCopy(big.c,bw,bh,pushK(44)):null;
          var ks=softCopy(big.c,bw,bh,clumpK(8)) || src;

            bb2=pushed(ks[o+2],wide,o,2);
            if(amt>0){
              rb+=nt[(((yb&63)<<6)|(xb&63))]*amt;
              gb+=nt[((((yb+23)&63)<<6)|((xb+17)&63))]*amt;
              bb2+=nt[((((yb+41)&63)<<6)|((xb+29)&63))]*amt;
            }

              rb<0?0:(rb>255?255:rb|0),
              gb<0?0:(gb>255?255:gb|0),

            if(++xb===bw){ xb=0; yb++; }

          for(rank=0;rank<n;rank++){

            else {

              src[pp+1]=(((cc>>8)&255)*g2  + src[pp+1]*f)|0;
              src[pp+2]=((cc&255)*g2       + src[pp+2]*f)|0;
            }
            src[pp+3]=255;
          }
          big.x.putImageData(img,0,0);
          shellFlash();
          shellSave(big.c.toDataURL('image/png'), fileName('gamut','png'));
          toast(commas(n)+' colours · saved');
        } catch(e){ toast('Not enough memory — lower the grain'); }
        btn.className='';
      }, 60);
    }

    reg({
      id:'gamut', name:'Gamut', line:'Every colour, once',
      note:'A palette with exactly as many colours as there are pixels, every one spent, none twice. The shutter develops a much larger frame — a second or two. Dither moves the sort order, not the output, so the rule still holds. Clump lets the sort listen to a softened copy of the picture, so neighbouring pixels take neighbouring colours instead of every speck of grain being ranked as if it were detail — turn it up in the dark, down for confetti. Local detail judges each pixel against its surroundings rather than against the whole frame, so a patch that was one flat colour gets the run of the entire palette. It is the same idea as HDR, pushed until it stops being reasonable.',
      v:v,
      ctrl:[
        {t:'seg',k:'order',label:'Thread',opts:[['hilbert','Hilbert'],['luma','Luma'],['hue','Hue']]},
        {t:'seg',k:'dither',label:'Dither',opts:[['blue','Blue'],['ordered','Ordered'],['white','White'],['off','Off']]},
        {t:'seg',k:'view',label:'View',opts:[['camera','Camera'],['plate','Plate']]},
        {t:'seg',k:'boil',label:'Noise',opts:[['still','Still'],['boil','Boil']]},
        {t:'sld',k:'grain',label:'Grain',min:40,max:340,rebuild:true},
        {t:'sld',k:'clump',label:'Clump',min:0,max:100},
        {t:'sld',k:'push',label:'Local detail',min:0,max:100},
        {t:'sld',k:'agit',label:'Agitate',min:0,max:100},
        {t:'sld',k:'fid',label:'Fidelity',min:0,max:100}
      ],
      init:build,
      size:build,
      shoot:function(){ if(v.view==='plate'){ shellFlash(); shellSave(stage.toDataURL('image/png'), fileName('gamut-plate','png')); toast('Plate saved'); } else develop(); },
      frame:function(){
        if(palOrdered && palOrdered.length!==palN) reorder();
        if(v.view==='plate'){ drawPlate(); return; }
        if(!grabInto(small,gw,gh)) return;
        var n=gw*gh, src=small.x.getImageData(0,0,gw,gh).data, L=lutFor(v.order), i, o;
        var wide=(v.push>0)?softCopy(small.c,gw,gh,pushK(16)):null;
        var kk=clumpK(3), sm=softSmall(small.c,gw,gh,kk);
        var sd=sm?sm.d:null, sw=sm?sm.w:0, sh=sm?sm.h:0;
        var amt=ditherAmt();
        var nt=(amt>0)?tileFor(v.dither):null;
        var ox=(amt>0&&v.boil==='boil')?(Math.random()*NS)|0:0;
        var oy=(amt>0&&v.boil==='boil')?(Math.random()*NS)|0:0;

            if(sx>=sw) sx=sw-1; if(sy>=sh) sy=sh-1;
            o=(sy*sw+sx)*4; r2=sd[o]; g2=sd[o+1]; b2=sd[o+2];
          } else {
            o=i*4; r2=src[o]; g2=src[o+1]; b2=src[o+2];
          }
          if(wide){ o=i*4; r2=pushed(r2,wide,o,0); g2=pushed(g2,wide,o,1); b2=pushed(b2,wide,o,2); }
          if(amt>0){
            r2+=nt[((((y+oy)&63)<<6)|((x+ox)&63))]*amt;
            g2+=nt[((((y+oy+23)&63)<<6)|((x+ox+17)&63))]*amt;
            b2+=nt[((((y+oy+41)&63)<<6)|((x+ox+29)&63))]*amt;
          }
          rq=r2<0?0:(r2>255?255:r2|0); gq=g2<0?0:(g2>255?255:g2|0); bq=b2<0?0:(b2>255?255:b2|0);
          keys[i]=L[((rq>>2)<<12)|((gq>>2)<<6)|(bq>>2)];
          if(++x===gw){ x=0; y++; }
        }
        var order=radix(keys,n,9,2,coherentOrder(gw,gh)), d=outImg.data, f=v.fid/100, g3=1-f, rk, pp, c;
        for(rk=0;rk<n;rk++){
          pp=order[rk]*4; c=palOrdered[rk];
          if(f<=0){ d[pp]=(c>>16)&255; d[pp+1]=(c>>8)&255; d[pp+2]=c&255; }
          else {
            d[pp]  =(((c>>16)&255)*g3 + src[pp]  *f)|0;
            d[pp+1]=(((c>>8)&255)*g3  + src[pp+1]*f)|0;
            d[pp+2]=((c&255)*g3       + src[pp+2]*f)|0;
          }
          d[pp+3]=255;
        }
        small.x.putImageData(outImg,0,0);
        ctx.imageSmoothingEnabled=false;
        ctx.drawImage(small.c,0,0,stage.width,stage.height);
        hSub.textContent=commas(palN)+' colours · '+
          (v.fid>0 ? ('blended, '+v.fid+'% true') : 'each exactly once');
      }
    });

    /* Thread changes need the palette resorted */
    var _lastOrder=v.order;
    setInterval(function(){
      if(v.order!==_lastOrder){ _lastOrder=v.order; reorder(); }
    }, 200);
  })();

  /* ---------------- INK — a fixed amount of ink ---------------- */
  (function(){

    }

      return cy*cellW+cx;

    function charge(){
      var n=v.n,i;
      gx=new Float32Array(n); gy=new Float32Array(n);
      cellW=Math.max(1,Math.ceil(FW/CELL)); cellH=Math.max(1,Math.ceil(FH/CELL));
      occ=new Int32Array(cellW*cellH);
      cap=Math.max(2,Math.round(n/(cellW*cellH)*4.5));

      FH=Math.max(8,Math.round(FW*(H/Math.max(W,1))));

      src.c.width=FW; src.c.height=FH;
      want=new Uint8Array(FW*FH);

    }
    function wAt(x,y){

    reg({
      id:'ink', name:'Ink', line:'A fixed amount of ink',
      note:'Grains lean toward wherever the picture wants ink, then step at random. Nothing is added and nothing removed.',
      v:v,
      ctrl:[
        {t:'seg',k:'pig',label:'Pigment',opts:[['ink','Ink'],['chalk','Chalk'],['point','Point']]},
        {t:'sld',k:'n',label:'Grains',min:600,max:20000,step:200,rebuild:true},
        {t:'sld',k:'line',label:'Tone → Line',min:0,max:100},
        {t:'sld',k:'bite',label:'Bite',min:0,max:100},
        {t:'sld',k:'bleed',label:'Bleed',min:0,max:92}
      ],
      init:build, size:build,
      frame:function(){
        if(!grabInto(src,FW,FH)) return;

      else if(r<0.48) base=rand(0.19,0.40);
      else if(r<0.80) base=rand(0.40,0.70);

    function shoot(p){
      if(!srcC || !srcC.c.width) return;

      if(!p.o) p.o=mk();
      var cw=res, ch=Math.round(res*(p.ph/p.pw));
      if(p.o.c.width!==cw||p.o.c.height!==ch){ p.o.c.width=cw; p.o.c.height=ch; p.pat=null; }
      var g=p.o.x, S=srcC.c;
      var sw=S.width*p.lens, sh=sw*(p.ph/p.pw);
      if(sh>S.height){ sh=S.height; sw=sh*(p.pw/p.ph); }
      var sx=clamp(p.u*S.width-sw/2,0,Math.max(0,S.width-sw));
      var sy=clamp(p.v*S.height-sh/2,0,Math.max(0,S.height-sh));
      g.globalCompositeOperation='source-over';
      g.drawImage(S,sx,sy,sw,sh,0,0,cw,ch);
      g.fillStyle = p.expo>0 ? 'rgba(255,252,244,'+(p.expo*0.13).toFixed(3)+')'
                             : 'rgba(12,10,16,'+(-p.expo*0.15).toFixed(3)+')';
      g.fillRect(0,0,cw,ch);
      if(canMultiply){
        g.globalCompositeOperation='multiply';
        g.fillStyle = p.warm>0 ? 'rgba(255,226,186,'+(p.warm*0.30+.06).toFixed(3)+')'
                               : 'rgba(198,224,255,'+(-p.warm*0.26+.06).toFixed(3)+')';

      var rows=Math.ceil(n/cols), k,i,j,cell,cx,cy,rot,size,a,r2,per,srows,u,uu,vv,pull;
      prints=[];

        } else if(v.layout==='fan'){

          cx=W/2+Math.cos(a*1.7)*r2; cy=H/2+Math.sin(a*1.7)*r2*0.9;

        {t:'seg',k:'stock',label:'Stock',opts:[['polaroid','Polaroid'],['print','C-print'],['bleed','Bleed']],rebuild:true},
        {t:'sld',k:'count',label:'Prints',min:6,max:110,rebuild:true},
        {t:'sld',k:'lens',label:'Zoom range',min:0,max:100,rebuild:true},
        {t:'sld',k:'hand',label:'Hand',min:0,max:100,rebuild:true},
        {t:'sld',k:'rate',label:'Seconds/print',min:2,max:80}
      ],
      init:function(){ build(); }, size:build,
      frame:function(){
        var vw=Math.min(1280, vid.videoWidth||960);
        if(!grabInto(srcC, vw, Math.round(vw*0.75))) return;
        if(!held){
          var t=now(),i;
          for(i=0;i<prints.length;i++) if(t>=prints[i].next){ shoot(prints[i]); prints[i].next=t+prints[i].every; }
        }
        var SW=stage.width, SH=stage.height, kx=SW/W, ky=SH/H;
        var bleed=(v.stock==='bleed'), p,fw,fh,ox,oy,i2;

  })();

  /* ---------------- FOLD — warp and weft, folded ---------------- */
  (function(){
    var cols=[], rows=[], cells=[], srcC=null, hist=[], HN=12, hi=0, histReady=false;
    var v={ fold:'mixed', warp:20, weft:17, slub:58, bite:82, rep:38, lag:26 };

    function splits(total,n,slub){
      var w=[],s=0,i,k=1+slub*4.5,j;
      for(i=0;i<n;i++){ j=Math.pow(Math.random(),k); w.push(0.10+j*1.9); s+=w[i]; }
      var e=[0],acc=0;
      for(i=0;i<n;i++){ acc+=w[i]/s*total; e.push(acc); }
      e[n]=total;
      return e;
    }
    function foldFor(){
      var f=v.fold, rc=v.rep/100, nx=1, ny=1, r;
      if(f==='quad'){ nx=2; ny=2; }
      else if(f==='vert'){ nx=1; ny=2; }
      else if(f==='horiz'){ nx=2; ny=1; }
      else {
        r=Math.random();
        if(r<0.30){ nx=2; ny=2; }
        else if(r<0.52){ nx=2; ny=1; }
        else if(r<0.74){ nx=1; ny=2; }
        else if(r<0.86){ nx=1; ny=1; }
        else { nx=2; ny=2; }
      }
      if(Math.random()<rc*0.55) nx*=2;
      if(Math.random()<rc*0.45) ny*=2;
      return {nx:nx,ny:ny};
    }
    function build(){
      if(!srcC) srcC=mk();
      cols=splits(W,v.warp,v.slub/100);
      rows=splits(H,v.weft,v.slub/100);
      cells=[];
      var i,j,f;
      for(j=0;j<v.weft;j++) for(i=0;i<v.warp;i++){
        f=foldFor();
        cells.push({i:i,j:j,nx:f.nx,ny:f.ny,bite:rand(0.55,1),lagRow:Math.random(),off:rand(-0.03,0.03)});
      }
      histReady=false;
    }
    function ensureHist(){
      if(histReady||!srcC.c.width) return;
      var w=480, h=Math.round(480*(srcC.c.height/srcC.c.width)), i;
      hist=[];
      for(i=0;i<HN;i++) hist.push(mk(w,h));
      hi=0; histReady=true;
    }
    function frameAt(back){
      if(!histReady||back<=0) return srcC.c;
      back=Math.min(back,HN-1);
      return hist[((hi-1-back)%HN+HN)%HN].c;
    }
    reg({
      id:'fold', name:'Fold', line:'A weaving camera',
      note:'The view cut into warp and weft, each cell folded back on itself.',
      v:v,
      ctrl:[
        {t:'seg',k:'fold',label:'Fold',opts:[['mixed','Mixed'],['quad','Quad'],['vert','Vert'],['horiz','Horiz']],rebuild:true},
        {t:'sld',k:'warp',label:'Warp',min:3,max:40,rebuild:true},
        {t:'sld',k:'weft',label:'Weft',min:3,max:40,rebuild:true},
        {t:'sld',k:'slub',label:'Slub',min:0,max:100,rebuild:true},
        {t:'sld',k:'bite',label:'Bite',min:10,max:100},
        {t:'sld',k:'lag',label:'Lag',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        var vw=Math.min(960, vid.videoWidth||640);
        if(!grabInto(srcC, vw, Math.round(vw*0.75))) return;
        ensureHist();
        if(v.lag>0 && histReady && !held){
          hist[hi].x.drawImage(srcC.c,0,0,hist[hi].c.width,hist[hi].c.height);
          hi=(hi+1)%HN;
        }
        var SW=stage.width, SH=stage.height, kx=SW/W, ky=SH/H;
        ctx.setTransform(kx,0,0,ky,0,0);
        ctx.fillStyle='#0D0B0A'; ctx.fillRect(0,0,W,H);
        var c,x0,x1,y0,y1,cw,ch,src2,u0,u1,vv0,vv1,bite,uc,vc,uw,vh2,sx,sy,sw,sh,nx,ny,tw,th,a,b,fx,fy,i;
        for(i=0;i<cells.length;i++){
          c=cells[i];
          x0=cols[c.i]; x1=cols[c.i+1]; y0=rows[c.j]; y1=rows[c.j+1];
          cw=x1-x0; ch=y1-y0;
          if(cw<0.6||ch<0.6) continue;
          src2=frameAt(Math.round(c.lagRow*(v.lag/100)*(HN-1)));
          u0=x0/W; u1=x1/W; vv0=y0/H; vv1=y1/H;
          bite=(v.bite/100)*c.bite;
          uc=(u0+u1)/2+c.off; vc=(vv0+vv1)/2;
          uw=(u1-u0)*bite; vh2=(vv1-vv0)*bite;
          sx=clamp((uc-uw/2)*src2.width,0,src2.width);
          sy=clamp((vc-vh2/2)*src2.height,0,src2.height);
          sw=clamp(uw*src2.width,1,src2.width-sx);
          sh=clamp(vh2*src2.height,1,src2.height-sy);
          nx=c.nx; ny=c.ny; tw=cw/nx; th=ch/ny;
          for(b=0;b<ny;b++) for(a=0;a<nx;a++){
            fx=(a%2)?-1:1; fy=(b%2)?-1:1;
            ctx.save();
            ctx.translate(x0+a*tw+(fx<0?tw:0), y0+b*th+(fy<0?th:0));
            ctx.scale(fx,fy);
            ctx.drawImage(src2,sx,sy,sw,sh,0,0,tw,th);
            ctx.restore();
          }
        }
        ctx.setTransform(1,0,0,1,0,0);
        hSub.textContent='warp '+v.warp+' · weft '+v.weft;
      }
    });
  })();

  /* ---------------- FACET — a compound eye ---------------- */
  (function(){
    var facets=[], R=10, hexPts=[], SW2=320, SH2=0, src=null, pixels=null, work=null, hexMask=null;
    var v={ mode:'mosaic', col:'human', n:2200, dome:45, gap:12, twitch:35 };

    function pts(rad){
      var p=[],k,a;
      for(k=0;k<6;k++){ a=Math.PI/180*(60*k-90); p.push([Math.cos(a)*rad, Math.sin(a)*rad]); }
      return p;
    }
    function build(){
      if(!W||!H) return;
      if(!src) src=mk();
      SW2=320; SH2=Math.max(2,Math.round(SW2*(H/Math.max(W,1))));
      src.c.width=SW2; src.c.height=SH2;
      work=mk(stage.width,stage.height);
      hexMask=mk(stage.width,stage.height);
      R=Math.max(2.5,Math.sqrt((W*H)/(2.598*v.n)));
      var hs=Math.sqrt(3)*R, vs=1.5*R;
      var ncols=Math.ceil(W/hs)+2, nrows=Math.ceil(H/vs)+2;
      var cx=W/2, cy=H/2, half=Math.min(W,H)/2, p=1+(v.dome/100)*1.6;
      facets=[];
      var r,c,x,y,nx,ny,rr2,k,su,sv;
      for(r=-1;r<nrows;r++) for(c=-1;c<ncols;c++){
        x=c*hs+((r&1)?hs/2:0); y=r*vs;
        if(x<-hs||x>W+hs||y<-vs||y>H+vs) continue;
        nx=(x-cx)/half; ny=(y-cy)/half;
        rr2=Math.sqrt(nx*nx+ny*ny);
        if(rr2<0.00001){ su=0.5; sv=0.5; }
        else { k=Math.pow(rr2,p)/rr2; su=0.5+nx*k*0.5; sv=0.5+ny*k*0.5; }
        facets.push({x:x,y:y,u:clamp(su,0,1),v:clamp(sv,0,1),pr:0,pg:0,pb:0});
      }
      hexPts=pts(R*(1-v.gap/100));
      hexMask.x.setTransform(stage.width/W,0,0,stage.height/H,0,0);
      hexMask.x.clearRect(0,0,W,H);
      hexMask.x.fillStyle='#fff';
      var i,j,f;
      for(i=0;i<facets.length;i++){
        f=facets[i];
        hexMask.x.beginPath();
        hexMask.x.moveTo(f.x+hexPts[0][0], f.y+hexPts[0][1]);
        for(j=1;j<6;j++) hexMask.x.lineTo(f.x+hexPts[j][0], f.y+hexPts[j][1]);
        hexMask.x.closePath(); hexMask.x.fill();
      }
      hexMask.x.setTransform(1,0,0,1,0,0);
    }
    var rgb=[0,0,0];
    function shade(r,g,b){
      if(v.col==='bee'){ rgb[0]=g; rgb[1]=b; rgb[2]=(255-r)*0.72; }
      else if(v.col==='mono'){ var y=(0.2126*r+0.7152*g+0.0722*b)|0; rgb[0]=y; rgb[1]=y; rgb[2]=y; }
      else { rgb[0]=r; rgb[1]=g; rgb[2]=b; }
    }
    reg({
      id:'facet', name:'Facet', line:'A compound eye',
      note:'Mosaic is what an insect sees — one sample per eye. Lens array is what a photograph through a cornea looks like.',
      v:v,
      ctrl:[
        {t:'seg',k:'mode',label:'Eye',opts:[['mosaic','Mosaic'],['lens','Lens array']]},
        {t:'seg',k:'col',label:'Receptors',opts:[['human','Human'],['bee','Bee'],['mono','Mono']]},
        {t:'sld',k:'n',label:'Ommatidia',min:120,max:7000,rebuild:true},
        {t:'sld',k:'dome',label:'Dome',min:0,max:100,rebuild:true},
        {t:'sld',k:'gap',label:'Chitin',min:0,max:45,rebuild:true},
        {t:'sld',k:'twitch',label:'Twitch',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        if(!grabInto(src,SW2,SH2)) return;
        pixels=src.x.getImageData(0,0,SW2,SH2).data;
        var SW=stage.width, SH=stage.height, kx=SW/W, ky=SH/H;
        var i,j,f,px,py,o,tw=v.twitch/100,d;
        if(v.mode==='mosaic'){
          ctx.setTransform(kx,0,0,ky,0,0);
          ctx.fillStyle='#0C0D0A'; ctx.fillRect(0,0,W,H);
          for(i=0;i<facets.length;i++){
            f=facets[i];
            px=(f.u*(SW2-1))|0; py=(f.v*(SH2-1))|0; o=(py*SW2+px)*4;

            ctx.beginPath();
            ctx.moveTo(f.x+hexPts[0][0], f.y+hexPts[0][1]);
            for(j=1;j<6;j++) ctx.lineTo(f.x+hexPts[j][0], f.y+hexPts[j][1]);
            ctx.closePath(); ctx.fill();
          }
          ctx.setTransform(1,0,0,1,0,0);
        } else {
          work.x.setTransform(kx,0,0,ky,0,0);
          work.x.clearRect(0,0,W,H);

              f.y-s/2+(f.v-0.5)*s*0.55, s*ar, s);

          work.x.globalCompositeOperation='destination-in';
          work.x.drawImage(hexMask.c,0,0);
          work.x.globalCompositeOperation='source-over';
          ctx.fillStyle='#0C0D0A'; ctx.fillRect(0,0,SW,SH);
          ctx.drawImage(work.c,0,0);
        }
        hSub.textContent=commas(facets.length)+' ommatidia · '+(v.mode==='mosaic'?'mosaic':'lens array');
      }
    });
  })();

        {t:'seg',k:'mode',label:'Structure',opts:[['relief','Relief'],['terrace','Terrace'],['echo','Echo'],['wave','Wave']]},
        {t:'seg',k:'ink',label:'Ink',opts:[['paper','Paper'],['carbon','Carbon'],['cobalt','Cobalt'],['rgb','RGB']]},
        {t:'sld',k:'lines',label:'Lines',min:45,max:320},
        {t:'sld',k:'height',label:'Elevation',min:0,max:100},

      note:'The camera pointed at its own output, a couple of frames behind. Drag the picture to move the point it folds into. Tint turns each pass a little further round the wheel.',
      v:v,
      ctrl:[
        {t:'seg',k:'screens',label:'Screens',opts:[['one','One'],['two','Two'],['three','Three']]},
        {t:'seg',k:'shape',label:'Shape',opts:[['rect','Frame'],['circle','Porthole']]},
        {t:'seg',k:'dir',label:'Direction',opts:[['in','Inward'],['out','Outward']]},
        {t:'sld',k:'loops',label:'Loops',min:2,max:13},
        {t:'sld',k:'depth',label:'Depth',min:55,max:92},
        {t:'sld',k:'twist',label:'Twist',min:0,max:20},
        {t:'sld',k:'tint',label:'Tint',min:0,max:60},
        {t:'sld',k:'delay',label:'Delay',min:1,max:20},
        {t:'sld',k:'ghost',label:'Ghost',min:0,max:1}
      ],
      init:build, size:build,
      touch:function(nx,ny){ tx=clamp(nx,0.04,0.96); ty=clamp(ny,0.04,0.96); },
      frame:function(){
        if(!ring.length) build();
        t+=0.016;
        var SW=stage.width, SH=stage.height;
        var d0=v.depth/100;
        // outward runs the feedback the other way, so the picture climbs out at you
        var sc = (v.dir==='out') ? (1/Math.max(0.62,d0)) : d0;
        var tw = v.twist/100*0.6*(v.dir==='out'?-1:1);
        cx+=(tx-cx)*0.12; cy+=(ty-cy)*0.12;   // ease toward wherever you touched
        drawBase();
        var px=cx*SW, py=cy*SH, i, ang, r;
        if(v.screens==='one'){
          feedbackAt(px,py,sc,tw);
        } else if(v.screens==='two'){
          feedbackAt(px,py,sc*0.8,tw);
          feedbackAt(SW-px,SH-py,sc*0.8,-tw);
        } else {
          r=Math.min(SW,SH)*0.22;
          for(i=0;i<3;i++){
            ang=t*0.4+(i*Math.PI*2)/3;
            feedbackAt(px+Math.cos(ang)*r, py+Math.sin(ang)*r, sc*0.62, tw+ang*0.1);
          }
        }
        // faint scanlines, as the original had
        ctx.fillStyle='rgba(0,0,0,.05)';
        for(var y2=0;y2<SH;y2+=6) ctx.fillRect(0,y2,SW,1);
        // remember this frame for the next pass
        head=(head+1)%RING;
        var d=ring[head];
        d.x.clearRect(0,0,RW,RH);
        d.x.drawImage(stage,0,0,SW,SH,0,0,RW,RH);
        hSub.textContent='loop depth '+v.loops+' · '+v.screens;
      }
    });
  })();

  /* =====================================================================
     SWITCHING, CONTROLS, SHOOTING
     ===================================================================== */
  /* ---------------- GOOBER — it finds a person and reports the obvious ---------------- */
  (function(){
    var SW2=104, SH2=0, src=null, t=0;
    var bx=0.5, by=0.42, bs=0.36, conf=0, lock=0, lx=0.5, ly=0.42;
    var e1x=0,e1y=0,e1vx=0,e1vy=0, e2x=0,e2y=0,e2vx=0,e2vy=0;
    var v={ bulge:58, eyes:62, wobble:64, alert:1, sens:50 };

    function build(){
      if(!src) src=mk();
      SH2=Math.max(40,Math.round(SW2*(H/Math.max(W,1))));
      src.c.width=SW2; src.c.height=SH2;
    }

    /* the old Kovac skin rule — crude, no model, works well enough to be funny */
    function detect(){
      if(!grabInto(src,SW2,SH2)) return;
      var d=src.x.getImageData(0,0,SW2,SH2).data;
      var n=SW2*SH2, i, o, r, g, b, mx, mn;
      var sum=0, sx=0, sy=0, sxx=0, syy=0, x, y;
      var slack=(v.sens-50)*0.35;
      for(i=0;i<n;i++){
        o=i*4; r=d[o]; g=d[o+1]; b=d[o+2];
        mx=r>g?(r>b?r:b):(g>b?g:b);
        mn=r<g?(r<b?r:b):(g<b?g:b);
        if(r>95-slack && g>40-slack && b>20-slack && (mx-mn)>15-slack &&
           Math.abs(r-g)>15-slack && r>g && r>b){
          x=i%SW2; y=(i/SW2)|0;
          sum++; sx+=x; sy+=y; sxx+=x*x; syy+=y*y;
        }
      }
      var frac=sum/n;
      if(sum>40){
        var cx=sx/sum, cy=sy/sum;
        var vxx=Math.max(1,sxx/sum-cx*cx), vyy=Math.max(1,syy/sum-cy*cy);
        var spread=Math.sqrt(Math.max(vxx,vyy))*2.6;
        var tx=cx/SW2, ty=cy/SH2, ts=clamp(spread/SW2,0.16,0.62);
        bx+=(tx-bx)*0.16; by+=(ty-by)*0.16; bs+=(ts-bs)*0.12;
        lock+=(1-lock)*0.08;
        conf+=(clamp(72+frac*260,72,99.4)-conf)*0.1;
      } else {
        lock+=(0-lock)*0.06;
        conf+=(0-conf)*0.1;
      }
    }

    function drawBase(){
      var SW=stage.width, SH=stage.height;
      var vr=vid.videoWidth/vid.videoHeight, cr=SW/SH, dw, dh;
      if(vr>cr){ dh=SH; dw=dh*vr; } else { dw=SW; dh=dw/vr; }
      ctx.save(); ctx.setTransform(1,0,0,1,0,0);
      if(facing==='user'){ ctx.translate(SW,0); ctx.scale(-1,1); }
      ctx.drawImage(vid,(SW-dw)/2,(SH-dh)/2,dw,dh);
      ctx.restore();
    }

    /* enlarge whatever it found, inside a soft circle */
    function bulge(cxp,cyp,rad){
      if(v.bulge<=0) return;
      var SW=stage.width, SH=stage.height;
      var k=1+(v.bulge/100)*0.85;
      var vr=vid.videoWidth/vid.videoHeight, cr=SW/SH, dw, dh;
      if(vr>cr){ dh=SH; dw=dh*vr; } else { dw=SW; dh=dw/vr; }
      ctx.save();
      ctx.beginPath(); ctx.arc(cxp,cyp,rad,0,Math.PI*2); ctx.clip();
      ctx.translate(cxp,cyp); ctx.scale(k,k); ctx.translate(-cxp,-cyp);
      if(facing==='user'){ ctx.translate(SW,0); ctx.scale(-1,1); }
      ctx.drawImage(vid,(SW-dw)/2,(SH-dh)/2,dw,dh);
      ctx.restore();
      // hide the seam
      ctx.save();
      ctx.strokeStyle='rgba(0,0,0,.16)';
      ctx.lineWidth=Math.max(2,rad*0.06);
      ctx.beginPath(); ctx.arc(cxp,cyp,rad,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    function googly(ex,ey,rad,st){
      // pupils lag behind, then settle — the whole joke is the delay
      var g=0.34*(v.wobble/100), sp=0.16, damp=0.80;
      st.vx += (0-st.x)*sp; st.vy += (0-st.y)*sp + g;
      st.vx*=damp; st.vy*=damp;
      st.x+=st.vx; st.y+=st.vy;
      var lim=rad*0.42, m=Math.sqrt(st.x*st.x+st.y*st.y);
      if(m>lim){ st.x=st.x/m*lim; st.y=st.y/m*lim; st.vx*=0.4; st.vy*=0.4; }
      ctx.save();
      ctx.fillStyle='#fff';
      ctx.strokeStyle='#111'; ctx.lineWidth=Math.max(1.5,rad*0.09);
      ctx.beginPath(); ctx.arc(ex,ey,rad,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#101010';
      ctx.beginPath(); ctx.arc(ex+st.x,ey+st.y,rad*0.42,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(ex+st.x-rad*0.14,ey+st.y-rad*0.16,rad*0.12,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    var eye1={x:0,y:0,vx:0,vy:0}, eye2={x:0,y:0,vx:0,vy:0};

    reg({
      id:'goober', name:'Goober', line:'It has identified a goober',
      note:'Finds a person by skin tone alone — no model, no network — then enlarges the head, applies eyes and states its conclusion.',
      v:v,
      ctrl:[
        {t:'sld',k:'bulge',label:'Bulge',min:0,max:100},
        {t:'sld',k:'eyes',label:'Eyes',min:0,max:100},
        {t:'sld',k:'wobble',label:'Wobble',min:0,max:100},
        {t:'sld',k:'sens',label:'Sensitivity',min:0,max:100},
        {t:'sld',k:'alert',label:'Alert',min:0,max:1}
      ],
      init:build, size:build,
      frame:function(){
        if(!vid.videoWidth) return;
        t+=0.016;
        detect();
        var SW=stage.width, SH=stage.height;
        drawBase();

        lx+=(bx-lx)*0.2; ly+=(by-ly)*0.2;
        var cxp=lx*SW, cyp=ly*SH, rad=bs*Math.min(SW,SH)*0.62;

        if(lock>0.15) bulge(cxp,cyp,rad);

        if(lock>0.15 && v.eyes>0){
          var er=rad*0.30*(v.eyes/100)*1.5;
          var off=rad*0.40;
          googly(cxp-off, cyp-rad*0.18, er, eye1);
          googly(cxp+off, cyp-rad*0.18, er, eye2);
          // a mouth, because it would be rude not to
          ctx.save();
          ctx.strokeStyle='#1a1a18';
          ctx.lineWidth=Math.max(2,rad*0.055);
          ctx.lineCap='round';
          ctx.beginPath();
          var mw=rad*0.40, mo=cyp+rad*0.34, wob=Math.sin(t*3.1)*rad*0.05;
          ctx.moveTo(cxp-mw,mo);
          ctx.quadraticCurveTo(cxp,mo+rad*0.22+wob,cxp+mw,mo);
          ctx.stroke();
          ctx.restore();
        }

        if(v.alert){
          ctx.save();
          ctx.setTransform(1,0,0,1,0,0);
          // the box it thinks it has found
          if(lock>0.15){
            var bw=rad*1.25, s2=Math.min(SW,SH)*0.045;
            var cor=[[cxp-bw,cyp-bw,1,1],[cxp+bw,cyp-bw,-1,1],[cxp-bw,cyp+bw,1,-1],[cxp+bw,cyp+bw,-1,-1]];
            ctx.strokeStyle='rgba(255,235,60,'+(0.35+lock*0.6).toFixed(2)+')';
            ctx.lineWidth=Math.max(2,SW/300);
            ctx.beginPath();
            for(var q=0;q<4;q++){
              var c=cor[q];
              ctx.moveTo(c[0]+c[2]*s2,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*s2);
            }
            ctx.stroke();
          }
          // the announcement
          var big=Math.max(15,Math.round(SW/17));
          ctx.font='700 '+big+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          var msg = lock>0.45 ? 'GOOBER ALERT' : (lock>0.15 ? 'POSSIBLE GOOBER' : 'SCANNING FOR GOOBERS');
          var yy = SH*0.13 + Math.sin(t*4)*(lock>0.45?big*0.09:0);
          var wpad=big*0.55;
          var tw=ctx.measureText(msg).width;
          ctx.fillStyle = lock>0.45 ? 'rgba(220,32,32,.9)' : 'rgba(12,13,16,.68)';
          ctx.fillRect(SW/2-tw/2-wpad, yy-big*0.78, tw+wpad*2, big*1.56);
          ctx.fillStyle='#fff';
          ctx.fillText(msg, SW/2, yy);
          ctx.font='500 '+Math.round(big*0.42)+'px "Helvetica Neue",Helvetica,Arial,sans-serif';
          ctx.fillStyle='rgba(255,255,255,.9)';
          ctx.fillText('CONFIDENCE '+conf.toFixed(1)+'%   NO MODEL WAS CONSULTED', SW/2, yy+big*1.35);
          ctx.restore();
        }
        hSub.textContent = lock>0.45 ? ('goober confirmed · '+conf.toFixed(0)+'%')
                                     : (lock>0.15 ? 'something goober-shaped' : 'no goober');
      }
    });
  })();


  /* ---------------- ONE BIT — two colours, nothing else ---------------- */
  (function(){
    var src=mk(), out=mk(), img=null, RW=200, RH=260;
    var L=null, W1=null, W2=null, prev=null, cur=null;
    var v={ ink:'mac', how:'atkinson', dots:200, bright:50, punch:55, local:45, steady:30 };

    var INKS={
      mac:[[238,236,229],[20,19,14]],
      negative:[[11,11,13],[241,239,231]],
      amber:[[15,11,7],[255,176,0]],
      blueprint:[[9,40,78],[221,234,246]],
      riso:[[243,239,230],[255,72,90]]
    };

    /* the 8x8 ordered grid, for when you want it to hold still */
    var BAY=null;
    function bayer(){
      if(BAY) return BAY;
      var m=[[0]],k,ss,nm,x,y,val;
      for(k=0;k<3;k++){
        ss=m.length; nm=[];
        for(y=0;y<ss*2;y++) nm.push(new Array(ss*2));
        for(y=0;y<ss;y++) for(x=0;x<ss;x++){
          val=m[y][x]*4;
          nm[y][x]=val; nm[y][x+ss]=val+2; nm[y+ss][x]=val+3; nm[y+ss][x+ss]=val+1;
        }
        m=nm;
      }
      BAY=new Float32Array(64);
      for(y=0;y<8;y++) for(x=0;x<8;x++) BAY[y*8+x]=(m[y][x]/64-0.5)*255;
      return BAY;
    }

    function build(){
      RW=Math.max(60,Math.min(460,v.dots|0));
      RH=Math.max(50,Math.round(RW*(H/Math.max(W,1))));
      src.c.width=RW;src.c.height=RH;out.c.width=RW;out.c.height=RH;
      img=out.x.createImageData(RW,RH);
      var n=RW*RH;
      L=new Float32Array(n); W1=new Float32Array(n); W2=new Float32Array(n);
      cur=new Float32Array(n); prev=null;
    }

    /* a wide average of the picture, used as the threshold — this is what
       keeps a face readable when one side of it is in shadow */
    function wide(radius){
      var x,y,i,sum,r=radius,inv=1/(r*2+1),n=RW*RH;
      for(y=0;y<RH;y++){
        sum=0;
        for(i=-r;i<=r;i++) sum+=L[y*RW+clamp(i,0,RW-1)];
        for(x=0;x<RW;x++){
          W1[y*RW+x]=sum*inv;
          sum+=L[y*RW+clamp(x+r+1,0,RW-1)]-L[y*RW+clamp(x-r,0,RW-1)];
        }
      }
      for(x=0;x<RW;x++){
        sum=0;
        for(i=-r;i<=r;i++) sum+=W1[clamp(i,0,RH-1)*RW+x];
        for(y=0;y<RH;y++){
          W2[y*RW+x]=sum*inv;
          sum+=W1[clamp(y+r+1,0,RH-1)*RW+x]-W1[clamp(y-r,0,RH-1)*RW+x];
        }
      }
    }

    reg({
      id:'onebit', name:'One Bit', line:'Two colours, nothing else',
      note:'The opposite end from Gamut. Every pixel is forced to one of two colours, and the error that forcing creates is handed on to the pixels not yet decided — which is why the greys you can plainly see are not there at all. Even out the light compares each pixel with the area around it instead of with the whole picture, which is what keeps a face readable when one side of it is in shadow. Atkinson is the Macintosh method and throws a quarter of the error away, so it snaps; Floyd–Steinberg keeps all of it and holds more shadow. Threshold is what happens with no dithering at all.',
      v:v,
      ctrl:[
        {t:'seg',k:'how',label:'Method',opts:[['atkinson','Atkinson'],['fs','Floyd'],['ordered','Grid'],['hard','None']]},
        {t:'seg',k:'ink',label:'Ink',opts:[['mac','Paper'],['negative','Negative'],['amber','Amber'],['blueprint','Blueprint'],['riso','Riso']]},
        {t:'sld',k:'dots',label:'Dots across',min:60,max:460,step:10,rebuild:true},
        {t:'sld',k:'bright',label:'Brightness',min:0,max:100},
        {t:'sld',k:'punch',label:'Contrast',min:0,max:100},
        {t:'sld',k:'local',label:'Even out the light',min:0,max:100},
        {t:'sld',k:'steady',label:'Hold still',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        if(!grabInto(src,RW,RH)) return;
        var s=src.x.getImageData(0,0,RW,RH).data, d=img.data, n=RW*RH;
        var i,x,y,l,thr,e,bit,o;
        var con=0.5+(v.punch/100)*1.7, bias=(v.bright-50)*1.7;
        var a=v.local/100, keep=(v.steady/100)*0.72;
        var ink=INKS[v.ink]||INKS.mac, pa=ink[0], pk=ink[1];

        /* 1. one grey number per pixel, pushed around a bit */
        for(i=0;i<n;i++){
          o=i*4;
          l=.2126*s[o]+.7152*s[o+1]+.0722*s[o+2];
          l=(l-128)*con+128+bias;
          L[i]=l<0?0:(l>255?255:l);
        }
        /* 2. steady it against the last frame, or error diffusion boils */
        if(keep>0){
          if(!prev){ prev=new Float32Array(n); prev.set(L); }
          else if(prev.length!==n){ prev=new Float32Array(n); prev.set(L); }
          else for(i=0;i<n;i++){ L[i]=L[i]*(1-keep)+prev[i]*keep; prev[i]=L[i]; }
        } else prev=null;

        /* 3. even out the light: judge each pixel against the area around it.
           This has to be done to the PICTURE, not to the threshold — error
           diffusion reproduces the local average whatever you threshold at,
           so moving the threshold alone would change nothing. */
        if(a>0){
          wide(Math.max(2,Math.round(RW/22)));
          for(i=0;i<n;i++){
            l=L[i]*(1-a)+(L[i]-W2[i]+128)*a;
            L[i]=l<0?0:(l>255?255:l);
          }
        }

        /* 4. force every pixel to one of two, passing the error on */
        cur.set(L);
        var how=v.how, bay=(how==='ordered')?bayer():null;
        if(how==='atkinson' || how==='fs'){
          var serp=(how==='fs'), x0,x1,dir,q;
          for(y=0;y<RH;y++){
            dir=(serp && (y&1)) ? -1 : 1;
            x0=(dir===1)?0:RW-1; x1=(dir===1)?RW:-1;
            for(x=x0;x!==x1;x+=dir){
              i=y*RW+x;
              thr=128;
              bit=cur[i]>=thr?1:0;
              e=cur[i]-(bit?255:0);
              if(how==='atkinson'){
                q=e/8;
                if(x+dir>=0&&x+dir<RW) cur[i+dir]+=q;
                if(x+dir*2>=0&&x+dir*2<RW) cur[i+dir*2]+=q;
                if(y+1<RH){
                  if(x-dir>=0&&x-dir<RW) cur[i+RW-dir]+=q;
                  cur[i+RW]+=q;
                  if(x+dir>=0&&x+dir<RW) cur[i+RW+dir]+=q;
                }
                if(y+2<RH) cur[i+RW*2]+=q;
              } else {
                if(x+dir>=0&&x+dir<RW) cur[i+dir]+=e*0.4375;
                if(y+1<RH){
                  if(x-dir>=0&&x-dir<RW) cur[i+RW-dir]+=e*0.1875;
                  cur[i+RW]+=e*0.3125;
                  if(x+dir>=0&&x+dir<RW) cur[i+RW+dir]+=e*0.0625;
                }
              }
              o=i*4;
              d[o]=bit?pa[0]:pk[0]; d[o+1]=bit?pa[1]:pk[1]; d[o+2]=bit?pa[2]:pk[2]; d[o+3]=255;
            }
          }
        } else {
          for(y=0;y<RH;y++) for(x=0;x<RW;x++){
            i=y*RW+x;
            thr=128;
            if(bay) thr+=bay[((y&7)<<3)|(x&7)];
            bit=L[i]>=thr?1:0;
            o=i*4;
            d[o]=bit?pa[0]:pk[0]; d[o+1]=bit?pa[1]:pk[1]; d[o+2]=bit?pa[2]:pk[2]; d[o+3]=255;
          }
        }

        out.x.putImageData(img,0,0);
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
        ctx.imageSmoothingEnabled=false;
        ctx.fillStyle='rgb('+pa[0]+','+pa[1]+','+pa[2]+')';
        ctx.fillRect(0,0,stage.width,stage.height);
        ctx.drawImage(out.c,0,0,stage.width,stage.height);
        hSub.textContent=RW+'×'+RH+' dots · '+
          (v.how==='atkinson'?'atkinson':(v.how==='fs'?'floyd–steinberg':(v.how==='ordered'?'ordered grid':'no dithering')))+
          ' · 2 colours';
      }
    });
  })();

  /* ---------------- RIBBON — one line per moment ---------------- */
  (function(){
    var scratch=mk(), buf=mk(), BW=2, BH=2, head=0, laid=0, tPrev=0, dtAvg=33;
    var v={ slit:'col', mode:'scroll', speed:3, thick:6, pos:50, mirror:'off' };

    function build(){
      BW=Math.max(2,stage.width); BH=Math.max(2,stage.height);
      if(buf.c.width!==BW || buf.c.height!==BH){ buf.c.width=BW; buf.c.height=BH; }
      buf.x.setTransform(1,0,0,1,0,0);
      buf.x.globalAlpha=1; buf.x.globalCompositeOperation='source-over';
      buf.x.fillStyle='#07080A'; buf.x.fillRect(0,0,BW,BH);
      head=0; laid=0; tPrev=0;
    }
    /* how long the whole frame covers, in seconds — the useful number */
    function span(step,L){ return (L/Math.max(1,step))*(dtAvg/1000); }

    reg({
      id:'ribbon', name:'Ribbon', line:'One line per moment',
      note:'Only one line of the sensor is ever kept. Each moment is laid down beside the last, so the picture is not a place but a length of time — the sideways axis is the clock. Stand still and the world draws itself in streaks; walk through it and you smear across the frame. Drag on the picture to move the line.',
      v:v,
      ctrl:[
        {t:'seg',k:'slit',label:'Line',opts:[['col','Standing'],['row','Lying down']]},
        {t:'seg',k:'mode',label:'Picture',opts:[['scroll','Rolls past'],['sweep','Sweeps across']]},
        {t:'seg',k:'mirror',label:'Mirror',opts:[['off','Off'],['on','On']]},
        {t:'sld',k:'speed',label:'Time squeeze',min:1,max:14},
        {t:'sld',k:'thick',label:'Line width',min:1,max:48},
        {t:'sld',k:'pos',label:'Where the line sits',min:0,max:100}
      ],
      init:build, size:build,
      touch:function(x,y){
        v.pos=clamp(Math.round((v.slit==='row'?y:x)*100),0,100);
      },
      frame:function(){
        if(buf.c.width!==stage.width || buf.c.height!==stage.height) build();
        var t=now();
        if(tPrev) dtAvg=dtAvg*0.9+Math.min(200,t-tPrev)*0.1;
        tPrev=t;

        if(!grabInto(scratch,BW,BH)) return;

  /* zoom and torch belong on the picture, not three taps deep in a sheet */

  /* pinch the picture to zoom, the way every other camera on the phone works */

  function bindQuick(){

  var peekT=null;

  (function(){

        var id=t.id;
        if(id==='sheet'||id==='deck'||id==='quick'||id==='nav'||id==='scrim'||id==='rack') return true;
        t=t.parentNode;

    W=stage.clientWidth; H=stage.clientHeight;

      var q=location.search||'';
      if(q.indexOf('s=1')<0){
        location.replace('https://'+location.host+location.pathname+
          (q ? q+'&s=1' : '?s=1')+location.hash);
        return;
      }
      errEl.innerHTML='This page will not load securely, so the browser will not release the camera. '+
        'Open <b>https://'+location.host+'</b> directly.';
      errEl.style.display='block';
      return;
    }
    if(inApp()){
      errEl.innerHTML='This is '+inApp()+'\u2019s built-in browser, which will not hand over a camera. '+

    if(/FBAN|FBAV/i.test(u)) return 'Facebook';

    if(/Snapchat/i.test(u)) return 'Snapchat';

  function tick(){
    try {
      if(vid.videoWidth){
        // Hold freezes the picture itself — the canvas simply keeps what it had
        if(!held){
          try {
            CAMS[cur].frame();
            lastGoodFrame=now(); frameErrs=0;
          } catch(e){
            frameErrs++;
            if(frameErrs===40){
              // this instrument is failing on this device — get out of it
              toast(CAMS[cur].name+' failed here — returning to Gamut');
              frameErrs=0;
              activate(0,true);
            }
          }
          if(!glActive()){ try { drawRaw(1-quickMix/100); } catch(e){} }
        } else {
          lastGoodFrame=now();
        }
        if(!glActive()){ try { drawGuide(); } catch(e){} }
      }
      if(recording){
        // if the picture has stopped moving, end the take rather than record silence over a still
        if(lastGoodFrame && now()-lastGoodFrame > 2500){
          if(!stallWarned){
            stallWarned=true;
            toast('Picture stalled — saving what was captured');
            stopRec();

        // hand the recorder exactly 30 frames a second, whatever the render rate

  function drawRaw(a){

    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=a;

    ctx.drawImage(vid, ax,ay,aw,ah, 0,0,SW,SH);
    ctx.restore();

  /* ---------- frame guide ---------- */
