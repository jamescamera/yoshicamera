<style>
  :root{
    --void:#0C0D10;
    --card:#E7E4DB;
    --ink:#1A1A17;
    --ink-soft:#6a675d;
    --accent:#C9A227;
    --rule:rgba(26,26,23,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-user-select:none;user-select:none;
  }
  canvas.stage{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:2;}
  /* the mask preview sits ON TOP of the picture rather than in it, so it can
     never end up in a still, a GIF or a recording */
  #maskv{z-index:3;opacity:0;pointer-events:none;transition:opacity .2s;}
  #maskv.on{opacity:1;}
  #gl{opacity:0;z-index:1;pointer-events:none;}
  video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}

  #hud{
    position:fixed;top:0;left:0;right:0;z-index:30;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 15px 12px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    pointer-events:none;
  }
  #hud .stack{text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #hud .n{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#F0EDE3;margin:0 0 3px;}
  #hud .sub{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(240,237,227,.6);margin:0;}
  #recDot{
    display:none;align-items:center;gap:7px;flex:none;
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#F0EDE3;
    background:rgba(12,13,16,.7);padding:5px 9px;border-radius:20px;
  }
  #recDot.on{display:flex;}
  #recDot i{width:7px;height:7px;border-radius:50%;background:#E5484D;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* pips showing where you are in the set */
  #quick{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);
    z-index:33;padding:0 14px;pointer-events:none;
  }
  #quick.off{display:none;}
  .qrow{display:flex;gap:12px;margin:0 0 8px;}
  .qs{flex:1 1 0;pointer-events:auto;background:rgba(12,13,16,.5);padding:6px 10px 2px;}
  .qs label{
    display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(240,237,227,.78);margin-bottom:1px;
  }
  .qs label b{font-weight:400;color:#F0EDE3;font-variant-numeric:tabular-nums;}
  .qs input[type=range]{height:22px;}
  .qs input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(240,237,227,.35);}
  .qs input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(240,237,227,.3);border-radius:3px;}
  .qs input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:19px;height:19px;margin-top:-8px;
    background:linear-gradient(to bottom,#FFFFFF,#B9B6AC);
    border:1px solid rgba(0,0,0,.45);border-radius:50%;
    box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .qs input[type=range]::-moz-range-track{height:1px;background:rgba(240,237,227,.35);}
  .qs input[type=range]::-moz-range-thumb{
    width:19px;height:19px;border-radius:50%;
    background:linear-gradient(to bottom,#FFFFFF,#B9B6AC);
    border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 4px rgba(0,0,0,.55);}
  .qchips{display:flex;gap:6px;justify-content:center;}
  .qchips button{
    pointer-events:auto;font:inherit;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:#F0EDE3;cursor:pointer;padding:9px 13px;border-radius:20px;
    background:linear-gradient(to bottom, rgba(58,60,66,.92), rgba(24,26,30,.92));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 2px 5px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13);
    transition:transform .08s, background .14s;
  }
  .qchips button:active{transform:translateY(1px);
    box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 2px 5px rgba(0,0,0,.45);}
  .qchips button.on{
    background:linear-gradient(to bottom, #E8C24E, var(--accent));
    color:var(--void);border-color:rgba(0,0,0,.35);
    box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);}
  #pips{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
    z-index:32;display:flex;justify-content:center;gap:6px;pointer-events:none;
  }
  #pips i{width:5px;height:5px;border-radius:50%;background:rgba(240,237,227,.3);transition:background .2s,transform .2s;}
  #pips i.on{background:var(--accent);transform:scale(1.5);}

  /* the lens itself, on the picture — only appears when the driver allows it */
  #lens{
    position:fixed;right:9px;top:50%;transform:translateY(-50%);
    z-index:34;display:none;flex-direction:column;align-items:center;gap:7px;
    pointer-events:none;
  }
  #lens.on{display:flex;}
  #lens .zv{
    font-size:9px;letter-spacing:.1em;color:#F0EDE3;font-variant-numeric:tabular-nums;
    background:rgba(12,13,16,.62);padding:4px 7px;border-radius:11px;
    border:1px solid rgba(255,255,255,.12);
  }
  #lens button{
    pointer-events:auto;font:inherit;font-size:10.5px;letter-spacing:.01em;
    color:#F0EDE3;cursor:pointer;width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(to bottom, rgba(58,60,66,.92), rgba(24,26,30,.92));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 2px 5px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13);
    transition:transform .08s, background .14s;
  }
  #lens button:active{transform:scale(.94);}
  #lens button.on{
    background:linear-gradient(to bottom, #E8C24E, var(--accent));
    color:var(--void);border-color:rgba(0,0,0,.35);
    box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);
  }
  #lens button.tor{font-size:16px;margin-top:4px;}
  @media (max-height:620px){ #lens button{width:36px;height:36px;font-size:9.5px;} }

  #deck{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 20px);
    display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none;
  }
  #deck > *{pointer-events:auto;}
  .tab{
    font:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    background:var(--card);color:var(--ink);border:0;padding:11px 13px;cursor:pointer;min-width:74px;
    box-shadow:0 4px 16px rgba(0,0,0,.55);
  }
  .tab.on{background:var(--accent);color:var(--void);}
  #bShot{
    width:72px;height:72px;border-radius:50%;flex:none;cursor:pointer;padding:0;
    background:var(--card);border:3px solid rgba(12,13,16,.6);
    box-shadow:0 5px 22px rgba(0,0,0,.6), inset 0 0 0 3px rgba(231,228,219,.95);
    transition:transform .1s;
  }
  #bShot:active{transform:scale(.92);}
  #bShot.busy{background:#9a978d;}
  /* holding the shutter is a different act from pressing it, and has to look it */
  #bShot.gif{
    background:var(--accent);
    box-shadow:0 5px 22px rgba(0,0,0,.6), inset 0 0 0 3px rgba(12,13,16,.35);
    animation:gifPulse .9s ease-in-out infinite;
  }
  @keyframes gifPulse{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
  #bRec{
    width:52px;height:52px;border-radius:50%;flex:none;cursor:pointer;padding:0;position:relative;
    background:rgba(12,13,16,.5);border:2px solid rgba(231,228,219,.9);transition:transform .1s;
  }
  #bRec:after{
    content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:#E5484D;transition:all .18s;
  }
  #bRec.on:after{width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:3px;}
  #bRec:active{transform:scale(.92);}

  #scrim{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:44;background:rgba(12,13,16,.12);
    opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
  }
  #scrim.on{opacity:1;visibility:visible;}
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:46;max-height:42vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:rgba(231,228,219,.9);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.25,1), opacity .18s;
    box-shadow:0 -10px 34px rgba(0,0,0,.6);
  }
  #sheet.on{transform:translateY(0);}
  #sheet:before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(to right,#C9A227 0 12%,#2E5FA3 12% 24%,#8C3B2E 24% 36%,
      #3F6E4B 36% 48%,#7A5EA8 48% 60%,#B8791E 60% 72%,#2A2A28 72% 84%,#D8D5CC 84% 100%);
    opacity:.8;
  }

  /* the rack of instruments */
  #rack{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin:0 0 4px;}
  #rack::-webkit-scrollbar{display:none;}
  #rack button{
    font:inherit;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto;
    color:var(--ink);border:1px solid rgba(26,26,23,.28);border-radius:20px;padding:9px 13px;cursor:pointer;
    background:linear-gradient(to bottom,#FFFDF7,#DFDBD0);
    box-shadow:0 1px 2px rgba(26,26,23,.2), inset 0 1px 0 rgba(255,255,255,.9);
  }
  #rack button:active{transform:translateY(1px);}
  #rack button.on{
    background:linear-gradient(to bottom,#E8C24E,var(--accent));color:var(--void);
    border-color:rgba(0,0,0,.3);}

  .seclabel{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 2px;}
  #hw .qs{background:transparent;padding:0;}
  #hw .qs label{color:var(--ink-soft);}
  #hw .qs label b{color:var(--ink);}
  #hw .qchips button{background:linear-gradient(to bottom,#FFFDF7,#DFDBD0);color:var(--ink);
    border:1px solid rgba(26,26,23,.3);}
  #hw .qchips button.on{background:linear-gradient(to bottom,#E8C24E,var(--accent));color:var(--void);}
  #camName{font-size:15px;font-weight:700;letter-spacing:.03em;margin:8px 0 2px;}
  #camLine{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px;}
  .hr{height:1px;background:var(--rule);margin:12px 0 0;}

  .row{display:flex;gap:5px;flex-wrap:wrap;}
  button.b{
    font:inherit;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);
    border:1px solid rgba(26,26,23,.3);border-radius:7px;padding:10px 6px;cursor:pointer;
    flex:1 1 22%;min-width:0;
    background:linear-gradient(to bottom,#FFFDF7,#DFDBD0);
    box-shadow:0 1px 2px rgba(26,26,23,.22), inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .08s, background .14s, color .14s;
  }
  button.b:active{transform:translateY(1px);
    background:linear-gradient(to bottom,#D6D2C6,#E9E5DA);
    box-shadow:inset 0 2px 4px rgba(26,26,23,.28);}
  button.b.on{
    background:linear-gradient(to bottom,#2E2E2A,#171714);color:var(--accent);
    border-color:#12120F;
    box-shadow:0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .grid2{display:flex;flex-wrap:wrap;gap:0 18px;}
  .field{margin:14px 0 0;flex:1 1 190px;}
  .field > label{
    display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
  }
  .field > label b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .note{font-size:9px;letter-spacing:.09em;line-height:1.8;color:var(--ink-soft);margin:14px 0 0;text-transform:uppercase;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;display:block;}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule);}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(26,26,23,.2);border-radius:3px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-10px;
    background:linear-gradient(to bottom,#FFFDF7,#CFCBBF);
    border:1px solid rgba(26,26,23,.42);border-radius:50%;
    box-shadow:0 2px 4px rgba(26,26,23,.35), inset 0 1px 0 rgba(255,255,255,.95);
  }
  input[type=range]::-moz-range-track{height:1px;background:var(--rule);}
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(to bottom,#FFFDF7,#CFCBBF);
    border:1px solid rgba(26,26,23,.42);
    box-shadow:0 2px 4px rgba(26,26,23,.35);}
  .seg{
    display:flex;border:1px solid rgba(26,26,23,.28);border-radius:8px;overflow:hidden;
    background:linear-gradient(to bottom,#D9D5C9,#EDE9DF);
    box-shadow:inset 0 2px 4px rgba(26,26,23,.18);
  }
  .seg button{
    border:0;border-right:1px solid rgba(26,26,23,.16);flex:1 1 0;padding:10px 3px;border-radius:0;
    background:transparent;box-shadow:none;
  }
  .seg button:last-child{border-right:0;}
  .seg button.on{
    border-radius:0;
    background:linear-gradient(to bottom,#2E2E2A,#171714);
    box-shadow:0 1px 3px rgba(0,0,0,.35);}

  .credit{
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:16px 0 0;padding-top:14px;
    border-top:1px solid var(--rule);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  }
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;opacity:.75;}
  .credit span{opacity:.55;}

  #gate{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--void);
    display:flex;align-items:center;justify-content:center;padding:30px;
  }
  #gate .card{background:var(--card);padding:26px 26px 24px;max-width:340px;width:100%;position:relative;}
  #gate .card:before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(to right,#C9A227 0 12%,#2E5FA3 12% 24%,#8C3B2E 24% 36%,
      #3F6E4B 36% 48%,#7A5EA8 48% 60%,#B8791E 60% 72%,#2A2A28 72% 84%,#D8D5CC 84% 100%);
    opacity:.8;
  }
  #gate h1{font-size:15px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;margin:14px 0 10px;}
  #gate p{font-size:10px;line-height:1.9;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 18px;text-transform:uppercase;}
  #gate button{width:100%;flex:none;padding:12px;font-size:10px;border:1px solid var(--ink);}
  #gate button.alt{margin-top:9px;border-color:var(--rule);color:var(--ink-soft);background:transparent;}
  #err{margin-top:13px;font-size:10px;line-height:1.7;color:#B4472B;letter-spacing:.03em;text-transform:none;display:none;}

  #flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:50;}
  #hint{
    position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);z-index:43;
    display:none;align-items:center;justify-content:center;gap:16px;pointer-events:none;
  }
  #hint.on{display:flex;animation:hintIn .4s ease-out;}
  #hint .harrow{
    font-size:30px;line-height:1;color:#F0EDE3;text-shadow:0 2px 10px rgba(0,0,0,.9);
    animation:nudge 1.5s ease-in-out infinite;
  }
  #hint .harrow:last-child{animation-delay:.75s;}
  #hint .hlabel{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#F0EDE3;
    background:rgba(12,13,16,.72);padding:11px 16px;border-radius:24px;
    box-shadow:0 4px 18px rgba(0,0,0,.6);
  }
  @keyframes nudge{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(-7px);opacity:1}}
  @keyframes hintIn{from{opacity:0}to{opacity:1}}
  #toast{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);z-index:55;
    background:rgba(12,13,16,.92);color:var(--card);font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;padding:9px 14px;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:82%;text-align:center;
  }
  #toast.on{opacity:1;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  @media (min-width:760px){
    #sheet{left:auto;right:20px;bottom:20px;width:440px;max-height:80vh;transform:translateY(120%);}
    #sheet.on{transform:translateY(0);}
  }

  /* =====================================================================
     LIQUID GLASS POLISH — deliberately CSS-first so the camera engines,
     recording path and WebKit/Android safeguards remain untouched.
     ===================================================================== */
  :root{
    --glass:rgba(244,242,236,.16);
    --glass-strong:rgba(244,242,236,.28);
    --glass-line:rgba(255,255,255,.36);
    --glass-shadow:0 14px 38px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.24);
    --accent-rgb:201,162,39;
  }
  html{color-scheme:dark;overscroll-behavior:none;}
  body{-webkit-touch-callout:none;overscroll-behavior:none;background:#08090C;}
  button,input{font:inherit;}
  button{position:relative;isolation:isolate;}
  button:disabled{opacity:.46;cursor:default;}

  #hud{padding-left:max(15px,env(safe-area-inset-left,0px));padding-right:max(15px,env(safe-area-inset-right,0px));}
  #hud .stack{
    padding:8px 10px 7px;border-radius:17px;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(18,19,24,.22));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 5px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  }
  #recDot{
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(9,10,14,.48));
    box-shadow:0 5px 18px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(14px) saturate(1.35);backdrop-filter:blur(14px) saturate(1.35);
  }

  #quick{
    left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
    padding:10px 12px 9px;border:1px solid var(--glass-line);border-radius:25px;
    background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(15,16,21,.28));
    box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:blur(22px) saturate(1.55);backdrop-filter:blur(22px) saturate(1.55);
    transition:opacity .22s,transform .28s cubic-bezier(.2,.8,.25,1);
  }
  .qrow{gap:16px;margin-bottom:7px;}
  .qs{background:transparent;padding:1px 3px 0;}
  .qs label{font-weight:600;text-shadow:0 1px 5px rgba(0,0,0,.6);}
  .qchips{gap:7px;}
  .qchips button{

<script>
(function(){
  "use strict";

  /* =====================================================================
     SHELL — camera, deck, sheet, recording. Shared by every instrument.
     ===================================================================== */
  var vid   = document.getElementById('vid');
  var stage = document.getElementById('stage');
  var ctx   = stage.getContext('2d');
  var glc   = document.getElementById('gl');
  var gate  = document.getElementById('gate');
  var errEl = document.getElementById('err');
  var flash = document.getElementById('flash');
  var sheet = document.getElementById('sheet');
  var scrim = document.getElementById('scrim');
  var toastEl = document.getElementById('toast');
  var hName = document.getElementById('hName');
  var hSub  = document.getElementById('hSub');
  var rackEl= document.getElementById('rack');
  var ctrlEl= document.getElementById('ctrls');
  var pipsEl= document.getElementById('pips');

  var W=0,H=0,DPR=1;
  var facing='user', stream=null, ready=false, held=false;
  var pageActive=!document.hidden, userStarted=false, starting=false;

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
            function(f){ return setTimeout(f,16); };
  var caf = window.cancelAnimationFrame || window.webkitCancelAnimationFrame || clearTimeout;
  var now = function(){
    return (window.performance && performance.now) ? performance.now() : Date.now();
  };

  function has(op){
    var c=document.createElement('canvas').getContext('2d');
    c.globalCompositeOperation=op;
    return c.globalCompositeOperation===op;
  }
  var canMultiply=has('multiply'), canDifference=has('difference'), canScreen=has('screen'), canHue=has('hue');

  var toastT=null;
  function toast(m){
    toastEl.textContent=m; toastEl.className='on';
    if(toastT) clearTimeout(toastT);
    toastT=setTimeout(function(){ toastEl.className=''; },2600);
  }
  function commas(n){
    var s=String(n),o='',i,c=0;
    for(i=s.length-1;i>=0;i--){ o=s.charAt(i)+o; if(++c%3===0&&i>0) o=','+o; }
    return o;
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function lerp(a,b,t){ return a+(b-a)*t; }   // Prism calls this and it was never defined
  function rand(a,b){ return a+Math.random()*(b-a); }
  function hash2(a,b){ var x=Math.sin(a*127.1+b*311.7+19.19)*43758.5453123; return x-Math.floor(x); }
  /* Every performance guard below used to test for Android only, which left
     iPhones — including the old one this gets used on — running flat out with
     no guard at all. These flags replace it: IS_PHONE for anything handheld,
     SLOW_DEVICE for the ones that actually need help, LOW_MEMORY for the worst. */
  var UA=navigator.userAgent||'';

  var IS_IOS=/iPad|iPhone|iPod/.test(UA) ||
             (navigator.platform==='MacIntel' && (navigator.maxTouchPoints||0)>1);
  var IS_PHONE=IS_ANDROID||IS_IOS;
  var SCREEN_LONG=Math.max(screen.width||0, screen.height||0);
  var CORES=navigator.hardwareConcurrency||2;

     has six or more and a long one, and does not need throttling */
  var OLD_IOS=IS_IOS && (CORES<=4 || (SCREEN_LONG>0 && SCREEN_LONG<=740));
  var SLOW_DEVICE=IS_ANDROID||OLD_IOS;
  var LOW_MEMORY=IS_PHONE && ((!!navigator.deviceMemory && navigator.deviceMemory<=4) ||
                 (IS_IOS && CORES<=2));

     over 100MB, which is what actually kills these cameras */
  function histCap(){ return LOW_MEMORY?18:(SLOW_DEVICE?26:(IS_PHONE?32:46)); }
  function glyphLimit(n){ return Math.max(160,Math.round(n*(LOW_MEMORY?.68:1))); }
  function adaptiveGlyphCell(sw,sh,wanted,limit){
    return Math.max(wanted,Math.ceil(Math.sqrt((sw*sh)/glyphLimit(limit))));
  }
  function mk(w,h){
    var c=document.createElement('canvas');
    if(w){ c.width=w; c.height=h; }

  /* a small chunky mark in the corner of every still, GIF frame and video
     frame this app saves — sized off the shorter side so it reads the same
     whether the export is a 240px GIF or a 12-megapixel plate */
  function stampMark(g,w,h){
    if(!w||!h) return;
    var s=Math.min(w,h), size=Math.max(8,Math.min(30,Math.round(s*0.02)));
    var pad=Math.max(6,Math.round(size*0.9));

    g.textAlign='right'; g.textBaseline='alphabetic';
    g.font='800 '+size+'px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
    try { g.letterSpacing=Math.max(1,Math.round(size*0.09))+'px'; } catch(e){}
    g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=size*0.3; g.shadowOffsetX=0; g.shadowOffsetY=size*0.05;
    g.fillStyle='rgba(255,255,255,.94)';
    g.fillText('YOSHI CAMERA', w-pad, h-pad);
    g.restore();
  }

  /* =====================================================================
     PHOTO — a file where the lens usually is.

     Every instrument in here reads its picture through grabInto(), and the
     only other thing that touches the <video> is drawRaw. So a still is not
     a special case: change what those two draw from and all of them work on
     an imported file without knowing anything happened.

     Why it exists: the good camera cannot be a live source. The X-Pro 2 only
     puts HDMI out in playback, and its USB webcam mode is desktop software at
     1024x768 — worse than the phone. But a file off the card is far better
     input than any phone sensor, so that is how the good pictures get in.
     ===================================================================== */
  var PHOTO=(function(){
    var master=null, label='', natural='', kind='', vidEl=null, vidUrl=null, vidStream=null;
    /* Gamut spends one colour of the RGB cube per pixel, and there are only
       16,777,216 of those, so a whole 24MP frame cannot obey its own rule.
       That is the hard ceiling. The device caps sit under it anyway, because
       every camera in here holds several buffers the size of the picture. */
    var CUBE=16777216;

      if(LOW_MEMORY) return 1200000;
      if(SLOW_DEVICE) return 2400000;

      label=(fname||'photo').replace(/\.[^.]+$/,'').slice(0,26)+' · '+w+'×'+h+
            (k<1 ? ' (from '+natural+')' : '');

      return true;
    }

      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var ok=take(im, im.naturalWidth||im.width, im.naturalHeight||im.height, file.name, done);
        try { URL.revokeObjectURL(url); } catch(e){}
        if(!ok && fail) fail();
      };
      im.onerror=function(){ try { URL.revokeObjectURL(url); } catch(e){} if(fail) fail(); };
      im.src=url;
    }
    /* every effect already reads its picture through one shared function
       (srcEl, in the block just below this one) that neither knows nor
       cares whether that element is the live camera or something else —
       so a looping <video> standing in for it needs no per-camera work at
       all. It just has to answer the same w()/h()/el() questions master
       does for a loaded photo. */
    function stopVideo(){
      if(vidEl){
        try { vidEl.pause(); } catch(e){}
        try { vidEl.removeAttribute('src'); vidEl.load(); } catch(e){}
        try { if(vidEl.parentNode) vidEl.parentNode.removeChild(vidEl); } catch(e){}
      }

      if(vidUrl){ try { URL.revokeObjectURL(vidUrl); } catch(e){} vidUrl=null; }
      vidStream=null;

  (function(){

      id:'ink', name:'Ink', line:'A fixed amount of ink',

      v:v,

  /* ---------------- RAIN — falling glyphs, weighed ---------------- */
  (function(){

  (function(){
    var src=mk(), paint=mk(), px=null, py=null, friend=null, enemy=null, N=0, pickAcc=0, lastDraw=0;
    var v={ ground:'paper', population:55, pull:35, loyalty:60, spite:35, fickle:40, trail:55 };

    function targetN(){
      // Live samples a dot's fill from the picture under it, so it only
      // reads as the scene rather than a colour smear once there are enough
      // dots to actually cover it — a swarm-sized population isn't enough.
      var live=(v.ground==='live');
      var base=live?(LOW_MEMORY?260:(SLOW_DEVICE?500:900)):(LOW_MEMORY?90:(SLOW_DEVICE?150:260));
      var extra=live?(LOW_MEMORY?540:(SLOW_DEVICE?1300:2600)):(LOW_MEMORY?90:(SLOW_DEVICE?160:340));
      return Math.max(24, Math.round(base+extra*(v.population/100)));
    }
    function rePick(i){
      var f=(Math.random()*N)|0; while(f===i) f=(Math.random()*N)|0;
      var e=(Math.random()*N)|0; while(e===i||e===f) e=(Math.random()*N)|0;
      friend[i]=f; enemy[i]=e;
    }
    /* one tick of the sim: drift to centre, step to friend, step from enemy,
       with a soft push back inward past 72% of the way to an edge so a
       subgroup can't march the whole way out and sit pinned on the frame */
    function step(SW,SH,pullK,loyaltyK,spiteK){
      var cx=SW/2, cy=SH/2, halfW=SW/2, halfH=SH/2, wallStart=0.72, i;
      pickAcc+=rate;
      while(pickAcc>=1){ pickAcc--; rePick((Math.random()*N)|0); }
      for(i=0;i<N;i++){
        var f=friend[i], e=enemy[i];
        var nx=px[i], ny=py[i];
        nx+=(cx-nx)*pullK; ny+=(cy-ny)*pullK;
        nx+=(px[f]-nx)*loyaltyK; ny+=(py[f]-ny)*loyaltyK;
        nx+=(nx-px[e])*spiteK; ny+=(ny-py[e])*spiteK;
        var ux=(nx-cx)/halfW, uy=(ny-cy)/halfH, aux=Math.abs(ux), auy=Math.abs(uy);
        if(aux>wallStart){ var ov=(aux-wallStart)/(1-wallStart); nx-=(ux<0?-1:1)*ov*ov*halfW*0.09; }
        if(auy>wallStart){ var ov2=(auy-wallStart)/(1-wallStart); ny-=(uy<0?-1:1)*ov2*ov2*halfH*0.09; }
        if(nx<0)nx=0; else if(nx>SW)nx=SW;
        if(ny<0)ny=0; else if(ny>SH)ny=SH;
        px[i]=nx; py[i]=ny;
      }
    }
    var rate=0.4;
    function build(){
      paint.c.width=stage.width; paint.c.height=stage.height;
      N=targetN();
      px=new Float32Array(N); py=new Float32Array(N);
      friend=new Int32Array(N); enemy=new Int32Array(N);
      var SW=stage.width, SH=stage.height, cx=SW/2, cy=SH/2, i;
      for(i=0;i<N;i++){ px[i]=cx+rand(-1,1)*SW*0.4; py[i]=cy+rand(-1,1)*SH*0.4; }
      for(i=0;i<N;i++) rePick(i);
      pickAcc=0;
      rate=0.02+(v.fickle/100)*0.6;
      var pullK=(v.pull/100)*0.012+0.003, loyaltyK=(v.loyalty/100)*0.075+0.008, spiteK=(v.spite/100)*0.03+0.003;
      // a fresh grid otherwise starts as the seed scatter it was born with —
      // recognisably unfinished for the first second or two on a live feed.
      // Run the sim forward in silence before the first pixel is ever shown,
      // so it opens already looking like itself.
      for(i=0;i<220;i++) step(SW,SH,pullK,loyaltyK,spiteK);
      paint.x.setTransform(1,0,0,1,0,0);
      paint.x.fillStyle=v.ground==='paper'?'#EDE7D8':'#0A0B0D';
      paint.x.fillRect(0,0,paint.c.width,paint.c.height);
    }
    reg({
      id:'colony', name:'Colony', line:'A friend-and-enemy camera',
      note:'Every dot has one friend it is drawn to and one enemy it edges away from — nothing else. Loyalty and Spite set how hard, Fickle sets how often a dot swaps allegiances, and Pull is the whole room’s quiet drift back toward the middle. Paper keeps it as ink on a page; Live lets the picture colour each dot where it stands.',
      v:v,
      ctrl:[
        {t:'seg',k:'ground',label:'Ground',opts:[['paper','Paper'],['dark','Dark'],['live','Live']],rebuild:true},
        {t:'sld',k:'population',label:'Population',min:20,max:100,rebuild:true},
        {t:'sld',k:'pull',label:'Pull',min:0,max:100},
        {t:'sld',k:'loyalty',label:'Loyalty',min:0,max:100},
        {t:'sld',k:'spite',label:'Spite',min:0,max:100},
        {t:'sld',k:'fickle',label:'Fickle',min:0,max:100},
        {t:'sld',k:'trail',label:'Trail',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        var stamp=now();
        if(SLOW_DEVICE && stamp-lastDraw<(LOW_MEMORY?46:32)) return;
        lastDraw=stamp;
        if(paint.c.width!==stage.width || paint.c.height!==stage.height) build();
        var SW=stage.width, SH=stage.height, live=(v.ground==='live');
        if(live) grabInto(src,Math.max(2,Math.round(SW/6)),Math.max(2,Math.round(SH/6)));

        rate=0.02+(v.fickle/100)*0.6;
        var pullK=(v.pull/100)*0.012+0.003, loyaltyK=(v.loyalty/100)*0.075+0.008, spiteK=(v.spite/100)*0.03+0.003;
        step(SW,SH,pullK,loyaltyK,spiteK);
        var i;

        var unit=Math.sqrt(SW*SH/N), rad=clamp(unit*0.16,1.3,9);
        var fade=0.05+(1-v.trail/100)*0.35;
        var ground=v.ground==='paper'?'#EDE7D8':(v.ground==='dark'?'#0A0B0D':'#0A0B0D');
        var ink=v.ground==='paper'?'rgba(28,25,20,.85)':'rgba(232,228,218,.85)';
        var pxctx=paint.x;
        pxctx.setTransform(1,0,0,1,0,0);
        pxctx.globalCompositeOperation='source-over';
        pxctx.globalAlpha=fade;
        pxctx.fillStyle=ground;
        pxctx.fillRect(0,0,SW,SH);
        pxctx.globalAlpha=1;
        var sd=live?src.x.getImageData(0,0,src.c.width,src.c.height).data:null, sw2=live?src.c.width:0, sh2=live?src.c.height:0;
        for(i=0;i<N;i++){
          if(live){
            var sx=Math.min(sw2-1,Math.max(0,(px[i]/SW*sw2)|0));
            var sy=Math.min(sh2-1,Math.max(0,(py[i]/SH*sh2)|0));
            var o=(sy*sw2+sx)*4;
            pxctx.fillStyle='rgba('+sd[o]+','+sd[o+1]+','+sd[o+2]+',.92)';
          } else pxctx.fillStyle=ink;
          pxctx.beginPath();
          pxctx.arc(px[i],py[i],rad,0,Math.PI*2);
          pxctx.fill();
        }

        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=1;
        ctx.fillStyle=ground;
        ctx.fillRect(0,0,SW,SH);
        ctx.drawImage(paint.c,0,0);
        // paint.c is opaque everywhere (its own fade wash never leaves a gap),
        // so drawing the live hint before it — as this used to — meant the
        // hint was immediately painted over and never actually visible. It
        // has to go on top, and needs real opacity or it still reads as
        // nothing but scattered dots on black.
        if(live){ ctx.globalAlpha=.45; ctx.drawImage(src.c,0,0,SW,SH); ctx.globalAlpha=1; }
        hSub.textContent=N+' dots · '+v.ground;
      }
    });
  })();

  /* ---------------- AFTERIMAGE — accumulated exposure ---------------- */
  (function(){
    var src=mk(), prev=mk(), acc=mk(), mask=mk(), FW=240, FH=180, lastDraw=0, prevReady=false;
    var tickN=0;
    var v={ mode:'chrono', tone:'ghost', exposure:72, replace:14, threshold:12, interval:62, image:8 };

    function build(){
      FW=SLOW_DEVICE?(LOW_MEMORY?210:270):Math.max(260,Math.min(430,Math.round(W*.56)));
      FH=Math.max(150,Math.round(FW*(H/Math.max(W,1))));
      src.c.width=FW; src.c.height=FH;
      prev.c.width=FW; prev.c.height=FH;
      mask.c.width=FW; mask.c.height=FH;
      acc.c.width=stage.width; acc.c.height=stage.height;
      acc.x.setTransform(1,0,0,1,0,0);
      acc.x.globalCompositeOperation='source-over';
      acc.x.globalAlpha=1;
      acc.x.fillStyle='#060608';
      acc.x.fillRect(0,0,acc.c.width,acc.c.height);
      prevReady=false; tickN=0;
    }
    function storePrev(){
      prev.x.setTransform(1,0,0,1,0,0);
      prev.x.globalCompositeOperation='source-over';
      prev.x.globalAlpha=1;
      prev.x.drawImage(src.c,0,0);
      prevReady=true;
    }
    function plateTone(r,g,b,diff){
      var l=.2126*r+.7152*g+.0722*b, e=clamp(diff/110,0,1), q;
      if(v.tone==='silver'){ q=Math.round(clamp(l*1.18+e*58,0,255)); return [q,q,q]; }
      if(v.tone==='heat') return [Math.round(clamp(185+r*.38+e*45,0,255)),Math.round(clamp(30+g*.38+e*92,0,255)),Math.round(clamp(20+b*.18,0,255))];
      if(v.tone==='colour') return [Math.round(clamp(r*1.12+12,0,255)),Math.round(clamp(g*1.08+8,0,255)),Math.round(clamp(b*1.15+18,0,255))];
      return [Math.round(clamp(105+l*.46+e*48,0,255)),Math.round(clamp(190+l*.28+e*42,0,255)),Math.round(clamp(220+l*.24+e*35,0,255))];
    }
    reg({
      id:'afterimage', name:'Afterimage', line:'An accumulated exposure camera',
      note:'The sensor behaves like a plate left open. Light Trail paints moving colour onto darkness, Chrono stacks photographic moments, Fade slowly replaces the world, and Difference exposes only change. Ghost, Silver and Heat alter the chemistry rather than tinting the finished image.',
      v:v,
      ctrl:[
        {t:'seg',k:'mode',label:'Exposure',opts:[['chrono','Chrono'],['trail','Light Trail'],['fade','Fade'],['difference','Difference']]},
        {t:'seg',k:'tone',label:'Chemistry',opts:[['ghost','Ghost'],['colour','Colour'],['silver','Silver'],['heat','Heat']]},
        {t:'sld',k:'exposure',label:'Exposure',min:0,max:100},
        {t:'sld',k:'replace',label:'Replacement',min:0,max:100},
        {t:'sld',k:'threshold',label:'Motion gate',min:0,max:100},
        {t:'sld',k:'interval',label:'Cadence',min:0,max:100},
        {t:'sld',k:'image',label:'Image',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        var stamp=now();
        if(SLOW_DEVICE && stamp-lastDraw<(LOW_MEMORY?116:86)) return;
        lastDraw=stamp;
        if(acc.c.width!==stage.width || acc.c.height!==stage.height) build();
        if(!grabInto(src,FW,FH)) return;
        var SW=stage.width, SH=stage.height;
        tickN++;

        var cur=src.x.getImageData(0,0,FW,FH);
        var data=cur.data;
        var accx=acc.x;
        var imgMix=v.image/100;
        var repl=v.replace/100;
        var expo=v.exposure/100;
        var gate=6+v.threshold*1.45;
        var cadence=Math.max(2,Math.round(3+(100-v.interval)*.35));

        if(!prevReady){
          accx.setTransform(1,0,0,1,0,0);
          accx.fillStyle='#060608'; accx.fillRect(0,0,SW,SH);
          accx.globalAlpha=.65; accx.drawImage(src.c,0,0,SW,SH); accx.globalAlpha=1;
          ctx.setTransform(1,0,0,1,0,0);
          ctx.fillStyle='#050609'; ctx.fillRect(0,0,SW,SH);
          ctx.drawImage(acc.c,0,0);
          storePrev();
          hSub.textContent='opening the exposure';
          return;
        }

        var old=prev.x.getImageData(0,0,FW,FH).data;
        var mimg=mask.x.createImageData(FW,FH), md=mimg.data;
        var active=0;
        for(var i=0;i<data.length;i+=4){
          var r=data[i], g=data[i+1], b=data[i+2];
          var diff=(Math.abs(r-old[i])+Math.abs(g-old[i+1])+Math.abs(b-old[i+2]))/3;
          var a=0;
          if(v.mode==='difference'){
            if(diff>gate){ a=Math.min(255,40+diff*3); active++; }
            else a=0;
          } else if(v.mode==='trail' || v.mode==='chrono'){
            if(diff>gate){ a=Math.min(255,26+diff*2.6); active++; }
          } else {
            a=255;
          }
          var chem=plateTone(r,g,b,diff);
          md[i]=chem[0]; md[i+1]=chem[1]; md[i+2]=chem[2]; md[i+3]=a|0;
        }
        mask.x.putImageData(mimg,0,0);

        accx.setTransform(1,0,0,1,0,0);
        accx.globalCompositeOperation='source-over';
        accx.globalAlpha=1;

        if(v.mode==='difference'){
          accx.fillStyle='rgba(2,3,6,'+(.14+repl*.22).toFixed(3)+')';
          accx.fillRect(0,0,SW,SH);
          accx.globalCompositeOperation=v.tone==='silver'?'source-over':'screen';
          accx.globalAlpha=.32+expo*.44;
          accx.drawImage(mask.c,0,0,SW,SH);
          accx.globalCompositeOperation='source-over';
        } else if(v.mode==='fade'){
          accx.fillStyle='rgba(3,4,7,'+(.012+repl*.075).toFixed(3)+')';
          accx.fillRect(0,0,SW,SH);
          accx.globalAlpha=.055+expo*.18;
          accx.drawImage(src.c,0,0,SW,SH);
        } else if(v.mode==='chrono'){
          accx.fillStyle='rgba(3,4,7,'+(.016+repl*.095).toFixed(3)+')';
          accx.fillRect(0,0,SW,SH);
          if((tickN%cadence)===0){
            accx.globalAlpha=.09+expo*.22;
            accx.drawImage(src.c,0,0,SW,SH);
          }
          accx.globalCompositeOperation='screen';
          accx.globalAlpha=.20+expo*.32;
          accx.drawImage(mask.c,0,0,SW,SH);
          accx.globalCompositeOperation='source-over';
        } else {
          accx.fillStyle='rgba(2,3,6,'+(.018+repl*.12).toFixed(3)+')';
          accx.fillRect(0,0,SW,SH);
          accx.globalCompositeOperation='screen';
          accx.globalAlpha=.24+expo*.42;
          accx.drawImage(mask.c,0,0,SW,SH);
          accx.globalCompositeOperation='source-over';
        }
        accx.globalAlpha=1;

        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=1;
        ctx.fillStyle='#050609';
        ctx.fillRect(0,0,SW,SH);
        if(imgMix>0 && v.mode!=='difference'){
          ctx.globalAlpha=.06+imgMix*.26;
          ctx.drawImage(src.c,0,0,SW,SH);
        }
        if('filter' in ctx && !SLOW_DEVICE && (v.mode==='trail' || v.mode==='chrono')){
          ctx.save();
          ctx.globalCompositeOperation='screen';
          ctx.globalAlpha=.05+expo*.14;
          ctx.filter='blur('+Math.round(1+expo*7)+'px)';
          ctx.drawImage(acc.c,0,0);
          ctx.restore();
          ctx.filter='none';
        }
        ctx.globalAlpha=1;
        ctx.drawImage(acc.c,0,0);
        var plateVg=ctx.createRadialGradient(SW*.5,SH*.48,Math.min(SW,SH)*.18,SW*.5,SH*.5,Math.max(SW,SH)*.76);
        plateVg.addColorStop(.56,'rgba(0,0,0,0)'); plateVg.addColorStop(1,'rgba(0,0,0,.28)');
        ctx.fillStyle=plateVg; ctx.fillRect(0,0,SW,SH);
        storePrev();
        var shown=(v.mode==='fade')?('slow replace '+Math.round(expo*100)):(active+' changed pixels');
        hSub.textContent=shown+' · '+v.mode+' · '+v.tone+(SLOW_DEVICE?' · mobile safe':'');
      }
    });
  })();



  /* ---------------- GLASS — a pane in front of the scene ---------------- */
  (function(){
    var src=null, SWs=0, SHs=0, cells=null, cellsFor='', t=0, dust=null;
    var v={ pane:'reeded', scale:42, depth:62, grime:24, tint:18, flip:1 };

    function build(){
      if(!src) src=mk();
      SWs=Math.max(2,Math.round(stage.width*0.75));
      SHs=Math.max(2,Math.round(stage.height*0.75));
      src.c.width=SWs; src.c.height=SHs;
      cellsFor='';
      makeDust();
    }

    /* the smears and specks that say there is something physical in the way */
    function makeDust(){
      dust=mk(256,256);
      var d=dust.x, i, x, y, r;
      d.clearRect(0,0,256,256);
      for(i=0;i<170;i++){
        x=Math.random()*256; y=Math.random()*256; r=Math.random()*1.6+0.2;
        d.fillStyle='rgba(255,255,255,'+(0.05+Math.random()*0.16).toFixed(3)+')';
        d.beginPath(); d.arc(x,y,r,0,Math.PI*2); d.fill();
      }
      for(i=0;i<14;i++){
        d.strokeStyle='rgba(255,255,255,'+(0.02+Math.random()*0.05).toFixed(3)+')';
        d.lineWidth=Math.random()*9+3;
        d.beginPath();
        x=Math.random()*256; y=Math.random()*256;
        d.moveTo(x,y);
        d.quadraticCurveTo(x+Math.random()*90-45, y+Math.random()*90-45, x+Math.random()*130-65, y+Math.random()*130-65);
        d.stroke();
      }
    }

    /* an irregular field of facets, for block and crazed panes */
    function makeCells(kind){
      var key=kind+'|'+v.scale+'|'+SWs+'x'+SHs;
      if(cellsFor===key) return;
      cellsFor=key;
      var base=Math.max(8, (v.scale/100)*Math.min(SWs,SHs)*0.16);
      cells=[];
      var y=0, h, x, w, jitter = kind==='crazed' ? 0.75 : 0.12;
      while(y<SHs){
        h=base*(1+(Math.random()*2-1)*jitter);
        x=0;
        while(x<SWs){
          w=base*(1+(Math.random()*2-1)*jitter);
          cells.push({x:x,y:y,w:w,h:h,
                      ox:(Math.random()*2-1), oy:(Math.random()*2-1)});
          x+=w;
        }
        y+=h;
      }
    }

    function pane(){
      var SW=stage.width, SH=stage.height;
      var S=src.c, k=SW/SWs;
      var depth=v.depth/100;
      var i, c, ox, oy;

      if(v.pane==='reeded'){
        // each rib is a little cylindrical lens: it shows a narrow slice, stretched
        var per=Math.max(3,(v.scale/100)*SW*0.085);
        var squeeze=1-depth*0.78;
        var x0, sw2, sx2, n=0;
        for(x0=0;x0<SW;x0+=per){
          sw2=(per*squeeze)/k;
          sx2=(x0/k)+((per/k)-sw2)/2;
          ctx.save();
          if(v.flip && (n&1)){
            ctx.translate(x0+per,0); ctx.scale(-1,1);
            ctx.drawImage(S, sx2,0,sw2,SHs, 0,0,per,SH);
          } else {
            ctx.drawImage(S, sx2,0,sw2,SHs, x0,0,per,SH);
          }
          ctx.restore();
          n++;
        }
        // the bright edge where each rib turns
        ctx.globalAlpha=0.16+depth*0.2;
        ctx.strokeStyle='#ffffff';
        ctx.lineWidth=Math.max(1,per*0.05);
        ctx.beginPath();
        for(x0=0;x0<=SW;x0+=per){ ctx.moveTo(x0,0); ctx.lineTo(x0,SH); }
        ctx.stroke();
        ctx.globalAlpha=1;

      } else if(v.pane==='fluted'){
        // the same idea turned on its side
        var perH=Math.max(3,(v.scale/100)*SH*0.085);
        var sq=1-depth*0.78, y0, sh2, sy2, m=0;
        for(y0=0;y0<SH;y0+=perH){
          sh2=(perH*sq)/k;
          sy2=(y0/k)+((perH/k)-sh2)/2;
          ctx.save();
          if(v.flip && (m&1)){
            ctx.translate(0,y0+perH); ctx.scale(1,-1);
            ctx.drawImage(S, 0,sy2,SWs,sh2, 0,0,SW,perH);
          } else {
            ctx.drawImage(S, 0,sy2,SWs,sh2, 0,y0,SW,perH);
          }
          ctx.restore();
          m++;
        }
        ctx.globalAlpha=0.16+depth*0.2;
        ctx.strokeStyle='#ffffff';
        ctx.lineWidth=Math.max(1,perH*0.05);
        ctx.beginPath();
        for(y0=0;y0<=SH;y0+=perH){ ctx.moveTo(0,y0); ctx.lineTo(SW,y0); }
        ctx.stroke();
        ctx.globalAlpha=1;

      } else if(v.pane==='blocks' || v.pane==='crazed'){
        makeCells(v.pane);
        var amp=depth*(v.pane==='crazed'?0.9:0.55);
        for(i=0;i<cells.length;i++){
          c=cells[i];
          ox=c.ox*c.w*amp; oy=c.oy*c.h*amp;
          ctx.drawImage(S,
            Math.max(0,Math.min(SWs-1,c.x+ox)), Math.max(0,Math.min(SHs-1,c.y+oy)),
            Math.max(1,c.w), Math.max(1,c.h),
            c.x*k, c.y*k, c.w*k+1, c.h*k+1);
        }
        // the seams between facets catch the light
        ctx.globalAlpha=v.pane==='crazed'?0.5:0.28;
        ctx.strokeStyle='rgba(226,240,246,.9)';
        ctx.lineWidth=Math.max(1,SW/900);
        ctx.beginPath();
        for(i=0;i<cells.length;i++){
          c=cells[i];
          ctx.rect(c.x*k, c.y*k, c.w*k, c.h*k);
        }
        ctx.stroke();
        ctx.globalAlpha=1;

      } else if(v.pane==='frosted'){
        // no single path through frosted glass — many, slightly apart
        var sp=1+depth*7, q;
        ctx.globalAlpha=1;
        ctx.drawImage(S,0,0,SW,SH);
        ctx.globalAlpha=0.34;
        for(q=0;q<5;q++){
          var a2=(q/5)*Math.PI*2;
          ctx.drawImage(S, 0,0,SWs,SHs,
            Math.cos(a2)*sp, Math.sin(a2)*sp, SW, SH);
        }
        ctx.globalAlpha=1;

      } else { /* facets */
        var wedges=Math.max(3,Math.round(3+(v.scale/100)*15));
        var cx=SW/2, cy=SH/2, R=Math.sqrt(SW*SW+SH*SH), step=Math.PI*2/wedges;
        for(i=0;i<wedges;i++){
          ctx.save();
          ctx.translate(cx,cy);
          ctx.rotate(i*step + t*0.05*depth);
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.arc(0,0,R,-step/2,step/2);
          ctx.closePath();
          ctx.clip();
          if(i&1) ctx.scale(1,-1);
          ctx.translate(-cx,-cy);

  /* ---------------- POLYGON — a low-poly console camera ----------------
     Early 3D consoles had no subpixel precision and no perspective-correct
     texturing: vertices snapped to a coarse fixed-point grid as they moved,
     so polygons swam and their textures sheared instead of gliding smoothly,
     over a colour-starved, dithered framebuffer. This rebuilds that from
     the live picture rather than drawing it on top: the frame is quantised
     to a handful of colours per channel with an ordered dither, then cut
     into a mesh of quads that are each independently mis-snapped and
     sheared, frame to frame. */
  (function(){
    var src=mk(), RW=72, RH=96, BAY4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
    var v={ sky:'void', pixels:72, polys:22, wobble:55, depth:60, dither:45, fog:25 };
    function build(){
      RW=Math.max(24,Math.min(200,v.pixels|0));

      src.c.width=RW; src.c.height=RH;
    }
    function skyColours(){
      if(v.sky==='haze') return ['#6E7E92','110,124,143'];
      if(v.sky==='dusk') return ['#33223F','176,120,150'];
      return ['#05060A','36,40,54'];
    }
    reg({
      id:'polygon', name:'Polygon', line:'A low-poly console camera',
      note:'Vertex snap breaks the picture into quads that never quite line up with the last frame — Wobble sets how far. Colour depth and Dither rebuild an old console’s starved, patterned palette; Fog fades the top of the frame the way early hardware hid its draw distance.',
      v:v,
      ctrl:[
        {t:'seg',k:'sky',label:'Fog colour',opts:[['void','Void'],['haze','Haze'],['dusk','Dusk']]},
        {t:'sld',k:'pixels',label:'Texels',min:24,max:200,rebuild:true},
        {t:'sld',k:'polys',label:'Polygons',min:6,max:36,rebuild:true},
        {t:'sld',k:'wobble',label:'Wobble',min:0,max:100},
        {t:'sld',k:'depth',label:'Colour depth',min:0,max:100},
        {t:'sld',k:'dither',label:'Dither',min:0,max:100},
        {t:'sld',k:'fog',label:'Fog',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        if(!grabInto(src,RW,RH)) return;
        var img=src.x.getImageData(0,0,RW,RH), d=img.data;
        var levels=Math.max(2,Math.round(2+(v.depth/100)*30)), step=255/(levels-1);
        var da=v.dither/100, x,y,by,o,val,dith;
        for(y=0;y<RH;y++){
          by=(y&3)*4;
          for(x=0;x<RW;x++){
            o=(y*RW+x)*4;
            dith=(BAY4[by+(x&3)]/16-0.5)*step*da;
            val=d[o]+dith;   d[o]  =val<0?0:(val>255?255:Math.round(val/step)*step);
            val=d[o+1]+dith; d[o+1]=val<0?0:(val>255?255:Math.round(val/step)*step);
            val=d[o+2]+dith; d[o+2]=val<0?0:(val>255?255:Math.round(val/step)*step);
          }
        }
        src.x.putImageData(img,0,0);

        var SW=stage.width, SH=stage.height, sky=skyColours();
        var cols=Math.max(4,v.polys|0), rows=Math.max(3,Math.round(cols*SH/SW));
        var cw=SW/cols, ch=SH/rows, scx=RW/cols, scy=RH/rows;
        var t=now()*0.0011, wob=v.wobble/100, j,i,h1,h2,jt,ox,oy,snap,shear;
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
        ctx.fillStyle=sky[0]; ctx.fillRect(0,0,SW,SH);
        ctx.imageSmoothingEnabled=false;
        for(j=0;j<rows;j++) for(i=0;i<cols;i++){
          h1=hash2(i*7+1,j*3+2); h2=hash2(i*5+9,j*11+4);
          jt=t*1.7+h1*41.0;

          oy=Math.cos(jt*0.8+h1*6.283)*ch*0.16*wob;

        }
        ctx.setTransform(1,0,0,1,0,0);
        ctx.imageSmoothingEnabled=true;

          var g=ctx.createLinearGradient(0,0,0,SH);
          g.addColorStop(0,'rgba('+sky[1]+','+(v.fog/100*0.85).toFixed(2)+')');
          g.addColorStop(0.6,'rgba('+sky[1]+',0)');
          ctx.fillStyle=g;
          ctx.fillRect(0,0,SW,SH);
        }
        hSub.textContent=RW+'×'+RH+' texels · '+levels+'-level colour · '+cols+'×'+rows+' polys';
      }
    });
  })();

  /* ---------------- BOKEH — a bokeh-and-sparkle camera ----------------
     Every pixel bright enough gets bloomed into a soft disc of its own
     colour, with a thin sparkle cross on the sharpest highlights — string
     lights and streetlamps turn into the out-of-focus orbs a fast lens
     draws them as, against a softened, warmed picture behind them. */
  (function(){
    var src=mk(), RW=140, RH=180;
    var v={ shape:'circle', threshold:55, size:45, sparkle:30, soft:55, density:45, warmth:40 };
    function build(){
      RW=SLOW_DEVICE?(LOW_MEMORY?96:120):160;
      RH=Math.max(40,Math.round(RW*(H/Math.max(W,1))));
      src.c.width=RW; src.c.height=RH;
    }
    reg({
      id:'bokeh', name:'Bokeh', line:'A bokeh-and-sparkle camera',
      note:'Threshold sets how bright a pixel has to be before it blooms into a disc of light; everything below it just stays part of the soft picture behind. Sparkle adds a thin cross of flare to the very brightest points, the way a fast lens draws a streetlamp.',
      v:v,
      ctrl:[
        {t:'seg',k:'shape',label:'Shape',opts:[['circle','Circle'],['hex','Hexagon']]},
        {t:'sld',k:'threshold',label:'Threshold',min:0,max:100},
        {t:'sld',k:'size',label:'Bokeh size',min:0,max:100},
        {t:'sld',k:'sparkle',label:'Sparkle',min:0,max:100},
        {t:'sld',k:'soft',label:'Softness',min:0,max:100},
        {t:'sld',k:'density',label:'Density',min:0,max:100},
        {t:'sld',k:'warmth',label:'Warmth',min:0,max:100}
      ],
      init:build, size:build,
      frame:function(){
        if(!grabInto(src,RW,RH)) return;
        var SW=stage.width, SH=stage.height;
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
        ctx.fillStyle='#05060A'; ctx.fillRect(0,0,SW,SH);

        // the soft, slightly warmed picture everything else sits on top of
        var blurPx=1+(v.soft/100)*Math.min(SW,SH)*0.035;
        ctx.filter=('filter' in ctx)?('blur('+blurPx.toFixed(1)+'px) saturate(1.05) brightness(0.92)'):'none';
        drawRaw(1);
        ctx.filter='none';
        if(v.warmth>0){
          ctx.globalCompositeOperation='soft-light';
          ctx.globalAlpha=(v.warmth/100)*0.35;
          ctx.fillStyle='rgba(255,170,90,1)';
          ctx.fillRect(0,0,SW,SH);
          ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
        }

        // find the highlights worth blooming
        var sd=src.x.getImageData(0,0,RW,RH).data;
        var thresh=150+(v.threshold/100)*95;
        var stride=Math.max(1,Math.round(1+(100-v.density)/100*5));
        var maxPts=SLOW_DEVICE?70:160, maxCandidates=maxPts*4;

            }

        }
        // always sorted brightest-first, so both the point cap and the
        // sparkle cap below take the strongest highlights, not whichever
        // pixels happened to be scanned first
        pts.sort(function(a,b2){ return b2.lum-a.lum; });
        if(pts.length>maxPts) pts.length=maxPts;

        // bloom each one into a soft, warmed disc
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation='screen';
        var sizeBase=Math.min(SW,SH)*(0.02+(v.size/100)*0.09), warm=v.warmth/100;
        /* a bright window or lamp fills many adjacent sample points at once —
           giving every one of them its own full flare let their lines stack
           up (screen blend) into a blown-out white blob. Sparkle now only
           lights the handful of overall-brightest points, however many
           points end up blooming into discs. */

          grad.addColorStop(0.5,'rgba('+rr+','+gg+','+bb+','+(0.22*excess).toFixed(2)+')');
          grad.addColorStop(1,'rgba('+rr+','+gg+','+bb+',0)');

          ctx.beginPath();

            ctx.strokeStyle='rgba(255,255,255,'+sAlpha.toFixed(2)+')';
            ctx.lineWidth=Math.max(0.5,rad*0.05);

            ctx.moveTo(px,py-flareLen); ctx.lineTo(px,py+flareLen);
            ctx.stroke();
          }
        }
        ctx.globalCompositeOperation='source-over';
        hSub.textContent=pts.length+' bokeh points · '+(v.shape==='hex'?'hexagon':'circle');
      }
    });
  })();

  /* ---------- sizing ---------- */
  /* a phone screen is 9:16 and a photograph is not, so in photo mode the two
     canvases are letterboxed to the file's shape. Everything downstream reads
     clientWidth/Height, so nothing else has to know about it. */
  function layoutStage(){
    var a=stage.style, b=glc.style, i;
    var mv=document.getElementById('maskv');
    if(!PHOTO.on()){
      a.left=b.left='0'; a.top=b.top='0';
      a.width=b.width='100%'; a.height=b.height='100%';
      if(mv){ mv.style.left='0'; mv.style.top='0'; mv.style.width='100%'; mv.style.height='100%'; }
      return;
    }
    var vw=window.innerWidth||stage.clientWidth, vh=window.innerHeight||stage.clientHeight;
    var ar=PHOTO.w()/PHOTO.h(), cw, ch;
    if(vw/vh>ar){ ch=vh; cw=vh*ar; } else { cw=vw; ch=vw/ar; }
    cw=Math.round(cw); ch=Math.round(ch);
    a.width=b.width=cw+'px';  a.height=b.height=ch+'px';
    a.left=b.left=Math.round((vw-cw)/2)+'px';
    a.top=b.top=Math.round((vh-ch)/2)+'px';
    if(mv){
      mv.style.width=a.width; mv.style.height=a.height;
      mv.style.left=a.left;   mv.style.top=a.top;
    }
  }

    stage.height=Math.round(H*DPR/2)*2;

  function askCam(fm){

  function start(){
    if(starting || !pageActive) return;

                 location.hostname!=='localhost' && location.hostname!=='127.0.0.1';
    if(insecure){
      // some in-app browsers still open the http link. Move, do not ask.
      var q=location.search||'';
      if(q.indexOf('s=1')<0){
        starting=false;
        location.replace('https://'+location.host+location.pathname+
          (q ? q+'&s=1' : '?s=1')+location.hash);
        return;
      }
      errEl.innerHTML='This page will not load securely, so the browser will not release the camera. '+
        'Open <b>https://'+location.host+'</b> directly.';
      errEl.style.display='block';
      starting=false;
      return;
    }
    if(inApp()){
      errEl.innerHTML='This is '+inApp()+'\u2019s built-in browser, which will not hand over a camera. '+
        'Tap the \u2026 menu and choose <b>Open in Safari</b>.';

      starting=false;

      ['catch'](function(){ return askCam(null); })

  /* A canvas cannot actually go brighter than white in most browsers, so the

     It is drawn on its own canvas above the picture, so it never reaches a
     still, a GIF or a recording. */

    if(!HDR.showingMask()){
      if(maskCan.className){
        maskCan.className='';
        maskCtx.clearRect(0,0,maskCan.width,maskCan.height);
      }
      return;
    }
    var S=sourceCanvas();
    if(!S || !S.width) return;
    if(maskCan.width!==stage.width || maskCan.height!==stage.height){
      maskCan.width=stage.width; maskCan.height=stage.height;
    }
    var stamp=now();
    if(stamp-maskAt<90) return;                 // it is a guide, not an effect
    maskAt=stamp;
    var mw=Math.max(8,Math.round(stage.width/6)), mh=Math.max(8,Math.round(stage.height/6));
    if(!maskSmall) maskSmall=mk(mw,mh);
    HDR.maskInto(maskSmall,S,mw,mh);
    maskCtx.setTransform(1,0,0,1,0,0);
    maskCtx.clearRect(0,0,maskCan.width,maskCan.height);
    maskCtx.globalCompositeOperation='source-over';
    maskCtx.globalAlpha=1;
    maskCtx.fillStyle='rgba(10,11,16,.62)';

    maskCtx.drawImage(maskSmall.c,0,0,mw,mh,0,0,maskCan.width,maskCan.height);
    maskCtx.globalCompositeOperation='source-over';

    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=a;
    if(srcMirror()){ ctx.translate(SW,0); ctx.scale(-1,1); }
    ctx.drawImage(srcEl(), ax,ay,aw,ah, 0,0,SW,SH);
    ctx.restore();
    ctx.globalAlpha=1;
  }

  /* ---------- frame guide ---------- */
  function frameRatio(){
    if(recAspect==='reel')   return 9/16;
    if(recAspect==='square') return 1;
    if(recAspect==='wide')   return 16/9;
    return (W&&H)?(W/H):(9/16);

  function drawGuide(){
    if(recAspect==='screen' || PHOTO.on()) return;   // the letterbox is the frame
    var SW2=stage.width, SH2=stage.height;
    var ar=frameRatio(), cw, ch;
    if(SW2/SH2>ar){ ch=SH2; cw=SH2*ar; } else { cw=SW2; ch=SW2/ar; }
    var x=(SW2-cw)/2, y=(SH2-ch)/2;
    if(cw>=SW2-1 && ch>=SH2-1) return;

    x+=ins; y+=ins; cw-=ins*2; ch-=ins*2;

    var corners=[[x,y,1,1],[x+cw,y,-1,1],[x,y+ch,1,-1],[x+cw,y+ch,-1,-1]];
    var pass,i,c;
    ctx.save();
    for(pass=0;pass<2;pass++){
      ctx.strokeStyle = pass?'rgba(255,255,255,.9)':'rgba(0,0,0,.4)';
      ctx.lineWidth = pass?w:w*3;
      ctx.beginPath();
      for(i=0;i<4;i++){
        c=corners[i];
        ctx.moveTo(c[0]+c[2]*len,c[1]);

    // and the audio carries on alone

    var ar=frameRatio(), w, h;
    if(ar>=1){ w=1920; h=Math.round(w/ar); if(h>1080){ h=1080; w=Math.round(h*ar); } }
    else     { h=1920; w=Math.round(h*ar); if(w>1080){ w=1080; h=Math.round(w/ar); } }
    w=Math.max(2,Math.round(w/2)*2); h=Math.max(2,Math.round(h/2)*2);

  /* =====================================================================
     EXTRA WHITE — a gain map, so the highlights go past white.

     An HDR screen has headroom above SDR white: it can drive some pixels
     harder than "maximum white" while their neighbours stay put. The way to
     ask for that in a file is a gain map — an ordinary SDR JPEG with a second,
     hidden JPEG appended saying, per pixel, how many stops of extra brightness
     to add. Which is exactly a mask, so this paints one from the highlights
     and leaves the rest of the picture alone.

     Anything that cannot read it — an old browser, an SDR screen, a printer —
     sees the first JPEG and is none the wiser.

     Layout is Google's Ultra HDR: GContainer XMP and an MPF segment in the
     primary, Adobe hdrgm XMP in the gain map. Offsets in the MPF entries are
     measured from the byte after "MPF\0", and the primary's own offset is
     written as zero because its SOI sits before that point.
     ===================================================================== */

        'xmlns:Container="http://ns.google.com/photos/1.0/container/" '+

        'hdrgm:Version="1.0">'+

        '<rdf:li rdf:parseType="Resource">'+

        '<Container:Item Item:Semantic="GainMap" Item:Mime="image/jpeg" Item:Length="'+gainLen+'"/>'+

        '<rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">'+

        'xmlns:hdrgm="http://ns.adobe.com/hdr-gain-map/1.0/" '+
        'hdrgm:Version="1.0" '+

  })();

    return keep;

    if(sw>=sh){ w=gifSize; h=Math.round(gifSize*sh/sw); }
    else { h=gifSize; w=Math.round(gifSize*sw/sh); }
    return { w:Math.max(2,w), h:Math.max(2,h) };

  /* one frame per turn of the event loop, so the page keeps drawing and the
     count keeps moving instead of the tab going white */

    var frames=gifFrames, w=gifCan.width, h=gifCan.height, n=w*h;

    btn.className='busy';
    var out=new GIF.Out(), idxBuf=new Uint8Array(n), i=0;
    GIF.head(out,w,h,0);
    toast('Writing '+frames.length+' frames…');

      var t0=now();
      /* keep going while the turn is still young — a small frame does several
         at a time, a big one does exactly one */
      do {
        var delay=(i+1<frames.length) ? (frames[i+1].t-frames[i].t) : (frames.length>1?frames[i].t-frames[i-1].t:100);
        GIF.frame(out, frames[i].d, n, w, h, Math.round(delay/10), idxBuf);
        frames[i].d=null;
        i++;

      if(i<frames.length){
        recDot.className='on';
        recTime.textContent=i+'/'+frames.length;

      recDot.className='';
      btn.className='';

    }

  }

    var want=WARMUP[id]||1;

  var developing=false;
  function developPhoto(){
    var c=CAMS[cur];
    if(c && c.shoot){ c.shoot(); return; }   // Gamut develops itself, at the file's size
    if(developing) return;
    var btn=document.getElementById('bShot');
    var sw=stage.width, sh=stage.height;
    if(PHOTO.w()<=sw){ shotNow(); return; }  // already at or above the file's size
    /* resizing the stage mid-take ends the video track on WebKit and leaves
       the audio running on alone, so a still during a take stays preview-sized */
    if(recording){ shotNow(); return; }
    developing=true;
    btn.className='busy';
    toast('Developing at ' + PHOTO.w() + '×' + PHOTO.h() + '…');
    if(rafHandle){ caf(rafHandle); rafHandle=0; }
    setTimeout(function(){
      var grown=false, i, k;
      /* setStageSize only touches stage.width/height — it never updates the
         page-level W/H that many cameras' own build() reads to lay out their
         internal geometry (grid counts, buffer sizes, absolute positions),
         on the assumption those always track the canvas. Developing at a
         file's full resolution, which can dwarf the live preview's viewport,
         breaks that assumption: the geometry gets built for a small canvas
         and then drawn onto a much bigger one, leaving most of it blank.
         Scaling W/H by the same factor the stage itself is about to grow by
         keeps that assumption true without needing to touch every camera. */
      var oldW=W, oldH=H;

        var scaleX=sw?PHOTO.w()/sw:1, scaleY=sh?PHOTO.h()/sh:1;

        if(grown){ setStageSize(sw,sh); W=oldW; H=oldH; camReady={}; c.init(); }

      developing=false;

  }

  /* A tap is a photograph and a hold is a GIF — the same button, told apart

  (function(){
    var btn=document.getElementById('bShot');
    var holdTimer=0, wasHold=false, down=false;

    function press(e){
      if(down || gifBusy) return;
      down=true; wasHold=false;

        holdTimer=0;
        if(!down) return;
        wasHold=true;
        gifBegin();
      }, GIF_HOLD_MS);

      if(!down) return;

        gifEnd();

    btn.addEventListener('touchend', release, false);
    btn.addEventListener('touchcancel', release, false);

    btn.addEventListener('mouseup', release, false);
    btn.addEventListener('mouseleave', release, false);

    btn.addEventListener('click', function(){
      if(wasHold){ wasHold=false; return; }   // that was a GIF, not a photograph

     reading it as zero or a few frames), so the clip looks far shorter than
     it is and cannot be trimmed past the phantom end. Chromium reserves an

  function patchWebmDurationBytes(b, durationMs){
    var ID_SEGMENT=0x18538067, ID_INFO=0x1549A966, ID_TIMECODESCALE=0x2AD7B1, ID_DURATION=0x4489;

    hdr=readEbmlId(b,off); if(hdr.id!==ID_SEGMENT) return null;

     "editable" range to that phantom fraction of a second. Confirmed by

  function patchMp4DurationBytes(b){

        else if(size===0){ size=end-off; }

        if(t===type) return {off:off, hdr:hdr, size:size};

        var size=u32(off);

        if(size===1){ size=u64(off+8); hdr=16; }
        else if(size===0){ size=end-off; }

      var mdhd=findBox(mdia.off+mdia.hdr, mdia.off+mdia.size, 'mdhd');
      if(!mdhd) continue;
      var dC=mdhd.off+mdhd.hdr, dVer=b[dC], tsOff, durOff, trackScale;
      if(dVer===1){ tsOff=dC+20; durOff=tsOff+4; trackScale=u32(tsOff); if(!trackScale) continue; w64(durOff, Math.round(realSeconds*trackScale)); }

    var vidScrubVal=document.getElementById('vidScrubVal');
    var scrubbing=false;

    function syncUI(){
      var on=PHOTO.on();
      bPhoto.textContent = on ? (PHOTO.kind()==='video' ? 'Change video' : 'Change photo') : 'Use a photo or video';
      bPhoto.className   = on ? 'b on' : 'b';
      bLive.style.display = on ? '' : 'none';
      hSub.textContent = on ? PHOTO.label() : 'swipe for a new experience';
      syncVidUI();
    }

    function fmtT(s){
      if(!isFinite(s) || s<0) return '0:00';
      var m=Math.floor(s/60), r=Math.floor(s%60);
      return m+':'+(r<10?'0':'')+r;
    }
    /* the scrub bar and play/pause only ever apply to a loaded video — a
       loaded photo or the live lens have nothing here to control */
    function syncVidUI(){
      var v=PHOTO.videoEl();
      bVidPlay.style.display = v ? '' : 'none';
      vidScrubField.style.display = v ? '' : 'none';
      if(!v) return;
      bVidPlay.textContent = v.paused ? 'Play video' : 'Pause video';
      bVidPlay.className = v.paused ? 'b on' : 'b';
      if(!scrubbing && isFinite(v.duration) && v.duration>0){
        vidScrub.value = Math.round((v.currentTime/v.duration)*1000);
      }
      vidScrubVal.textContent = fmtT(v.currentTime)+' / '+fmtT(v.duration);
    }
    bVidPlay.addEventListener('click', function(){
      var v=PHOTO.videoEl();
      if(!v) return;
      if(v.paused){ var p=v.play(); if(p && p['catch']) p['catch'](function(){}); } else v.pause();
      syncVidUI();
    });
    function scrubStart(){
      var v=PHOTO.videoEl();
      if(!v) return;
      scrubbing=true;
      if(!v.paused) v.pause();   // dragging a moving target is no fun
      peek(true);
    }
    vidScrub.addEventListener('touchstart', scrubStart, false);
    vidScrub.addEventListener('mousedown', scrubStart, false);
    vidScrub.addEventListener('input', function(){
      var v=PHOTO.videoEl();
      if(!v || !isFinite(v.duration) || v.duration<=0) return;
      v.currentTime=(vidScrub.value/1000)*v.duration;
      vidScrubVal.textContent=fmtT(v.currentTime)+' / '+fmtT(v.duration);
    });
    vidScrub.addEventListener('change', function(){ scrubbing=false; });
    setInterval(syncVidUI, 400);

    function enter(){
      hideHint();
      stopStream();                 // the lens is not needed while a file is loaded
      userStarted=true; pageActive=true; starting=false;
      gate.style.display='none';
      errEl.style.display='none';
      camCaps=null; camTrack=null;
      buildHardware(); buildLens();
      ready=true;
      resize();                     // rebuilds the camera at the file's shape
      activate(cur,true);
      scheduleTick();
      syncUI();
      toast(PHOTO.label());
    }

    function leave(){
      PHOTO.clear();
      syncUI();
      ready=false;
      layoutStage();
      if(pageActive) start();
      else { gate.style.display='flex'; }
    }

    function load(file){
      PHOTO.load(file, enter, function(m){ toast(m||'Could not open that file'); });
    }

    pick.addEventListener('change', function(){
      var f=this.files && this.files[0];
      this.value='';                // so the same file can be chosen twice
      if(f) load(f);
    });
    function ask(){ pick.click(); }
    bPhoto.addEventListener('click', function(){ ask(); openSheet(false); });
    if(bGate) bGate.addEventListener('click', ask);
    bLive.addEventListener('click', function(){ leave(); openSheet(false); });

    /* on a desktop the file is usually already on screen somewhere */
    function stop(e){ e.preventDefault(); e.stopPropagation(); }
    window.addEventListener('dragover', stop, false);
    window.addEventListener('drop', function(e){
      stop(e);
      var dt=e.dataTransfer;
      if(dt && dt.files && dt.files[0]) load(dt.files[0]);
    }, false);
    window.addEventListener('paste', function(e){
      var it=e.clipboardData && e.clipboardData.items, i, f;
      if(!it) return;
      for(i=0;i<it.length;i++){
        if(it[i].type && (it[i].type.indexOf('image/')===0 || it[i].type.indexOf('video/')===0)){
          f=it[i].getAsFile();
          if(f){ load(f); return; }
        }
      }
    }, false);

    window.addEventListener('resize', syncUI);
    syncUI();
  })();

  (function(){
    var w=inApp();
    if(w){
      var g2=document.getElementById('gate');
      var card=g2 && g2.querySelector('.card');
      if(card){
        var p2=document.createElement('p');
        p2.style.cssText='font-size:10px;line-height:1.8;letter-spacing:.06em;color:#B4472B;'+
          'text-transform:none;margin:0 0 14px;';
        p2.innerHTML='You are in '+w+'\u2019s built-in browser. It will not give a web page the camera. '+
          'Tap the \u2026 menu and choose <b>Open in Safari</b> or <b>Open in Chrome</b>.';
        card.insertBefore(p2, card.querySelector('button'));
      }
    }
  })();

  (function(){
    var g=document.getElementById('gateLine');
    if(g) g.textContent = CAMS.length + ' cameras that refuse to behave, on one shutter. ' +
      'Swipe for a new experience.';
  })();

  document.addEventListener('visibilitychange', function(){
    if(document.hidden) suspendPage(); else resumePage();
  });
  window.addEventListener('pagehide', suspendPage);
  window.addEventListener('pageshow', function(){ if(!document.hidden) resumePage(); });
  window.addEventListener('beforeunload', suspendPage);

  /* installed to the home screen, and working without a signal */
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')['catch'](function(){});
    });
  }

  /* offer the install once, quietly, on the opening card */
  (function(){
    var prompt=null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault();
      prompt=e;
      var g=document.getElementById('gate');
      if(!g || g.style.display==='none') return;
      var b=document.createElement('button');
      b.textContent='Add to home screen';
      b.style.marginTop='8px';
      b.addEventListener('click', function(){
        b.style.display='none';
        prompt.prompt();
        prompt=null;
      });
      var card=g.querySelector('.card');
      if(card) card.appendChild(b);
    });
  })();

  resize();
})();
</script>
</body>
</html>
