<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --void:#0C0D10;
    --card:#E7E4DB;
    --ink:#1A1A17;
    --ink-soft:#6a675d;
    --accent:#C9A227;
    --rule:rgba(26,26,23,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden;}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-user-select:none;user-select:none;
  }
  canvas.stage{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;}
  #gl{display:none;}
  #host{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:none;background:var(--void);z-index:5;}
  #host.on{display:block;}
  /* stepping between instruments, always reachable even over a hosted page */
  #nav{position:fixed;top:0;left:0;right:0;z-index:41;display:none;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;gap:8px;align-items:center;justify-content:center;
    background:linear-gradient(to bottom,rgba(12,13,16,.9),rgba(12,13,16,0));pointer-events:none;}
  #nav.on{display:flex;}
  #nav button{pointer-events:auto;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    background:rgba(231,228,219,.92);color:var(--ink);border:0;padding:9px 13px;cursor:pointer;}
  #nav span{pointer-events:none;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#F0EDE3;
    text-shadow:0 1px 5px rgba(0,0,0,.8);min-width:96px;text-align:center;}
  video{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}

  #hud{
    position:fixed;top:0;left:0;right:0;z-index:30;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 15px 12px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    pointer-events:none;
  }
  #hud .stack{text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #hud .n{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#F0EDE3;margin:0 0 3px;}
  #hud .sub{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(240,237,227,.6);margin:0;}
  #recDot{
    display:none;align-items:center;gap:7px;flex:none;
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#F0EDE3;
    background:rgba(12,13,16,.7);padding:5px 9px;border-radius:20px;
  }
  #recDot.on{display:flex;}
  #recDot i{width:7px;height:7px;border-radius:50%;background:#E5484D;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* pips showing where you are in the set */
  #pips{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
    z-index:32;display:flex;justify-content:center;gap:6px;pointer-events:none;
  }
  #pips i{width:5px;height:5px;border-radius:50%;background:rgba(240,237,227,.3);transition:background .2s,transform .2s;}
  #pips i.on{background:var(--accent);transform:scale(1.5);}

  #deck{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 20px);
    display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none;
  }
  #deck > *{pointer-events:auto;}
  .tab{
    font:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    background:var(--card);color:var(--ink);border:0;padding:11px 13px;cursor:pointer;min-width:74px;
    box-shadow:0 4px 16px rgba(0,0,0,.55);
  }
  .tab.on{background:var(--accent);color:var(--void);}
  #bShot{
    width:72px;height:72px;border-radius:50%;flex:none;cursor:pointer;padding:0;
    background:var(--card);border:3px solid rgba(12,13,16,.6);
    box-shadow:0 5px 22px rgba(0,0,0,.6), inset 0 0 0 3px rgba(231,228,219,.95);
    transition:transform .1s;
  }
  #bShot:active{transform:scale(.92);}
  #bShot.busy{background:#9a978d;}
  #bRec{
    width:52px;height:52px;border-radius:50%;flex:none;cursor:pointer;padding:0;position:relative;
    background:rgba(12,13,16,.5);border:2px solid rgba(231,228,219,.9);transition:transform .1s;
  }
  #bRec:after{
    content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:#E5484D;transition:all .18s;
  }
  #bRec.on:after{width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:3px;}
  #bRec:active{transform:scale(.92);}

  #scrim{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:44;background:rgba(12,13,16,.12);
    opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
  }
  #scrim.on{opacity:1;visibility:visible;}
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:46;max-height:42vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:rgba(231,228,219,.9);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.25,1), opacity .18s;
    box-shadow:0 -10px 34px rgba(0,0,0,.6);
  }
  #sheet.on{transform:translateY(0);}
  #sheet:before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(to right,#C9A227 0 12%,#2E5FA3 12% 24%,#8C3B2E 24% 36%,
      #3F6E4B 36% 48%,#7A5EA8 48% 60%,#B8791E 60% 72%,#2A2A28 72% 84%,#D8D5CC 84% 100%);
    opacity:.8;
  }

  /* the rack of instruments */
  #rack{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin:0 0 4px;}
  #rack::-webkit-scrollbar{display:none;}
  #rack button{
    font:inherit;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto;
    background:transparent;color:var(--ink);border:1px solid var(--rule);padding:9px 11px;cursor:pointer;
  }
  #rack button.on{background:var(--ink);color:var(--accent);border-color:var(--ink);}

  #camName{font-size:15px;font-weight:700;letter-spacing:.03em;margin:8px 0 2px;}
  #camLine{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px;}
  .hr{height:1px;background:var(--rule);margin:12px 0 0;}

  .row{display:flex;gap:5px;flex-wrap:wrap;}
  button.b{
    font:inherit;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;background:transparent;color:var(--ink);
    border:1px solid var(--rule);padding:9px 6px;cursor:pointer;flex:1 1 22%;min-width:0;
    transition:background .14s,color .14s,border-color .14s;
  }
  button.b:active{background:var(--ink);color:var(--card);}
  button.b.on{background:var(--ink);border-color:var(--ink);color:var(--accent);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .grid2{display:flex;flex-wrap:wrap;gap:0 18px;}
  .field{margin:14px 0 0;flex:1 1 190px;}
  .field > label{
    display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
  }
  .field > label b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;}
  .note{font-size:9px;letter-spacing:.09em;line-height:1.8;color:var(--ink-soft);margin:14px 0 0;text-transform:uppercase;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;display:block;}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;margin-top:-6px;
    background:var(--ink);border:0;border-radius:50%;
  }
  input[type=range]::-moz-range-track{height:1px;background:var(--rule);}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--ink);border:0;border-radius:50%;}
  .seg{display:flex;border:1px solid var(--rule);}
  .seg button{border:0;border-right:1px solid var(--rule);flex:1 1 0;padding:9px 3px;}
  .seg button:last-child{border-right:0;}

  .credit{
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:16px 0 0;padding-top:14px;
    border-top:1px solid var(--rule);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  }
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;opacity:.75;}
  .credit span{opacity:.55;}

  #gate{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--void);
    display:flex;align-items:center;justify-content:center;padding:30px;
  }
  #gate .card{background:var(--card);padding:26px 26px 24px;max-width:340px;width:100%;position:relative;}
  #gate .card:before{
    content:"";position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(to right,#C9A227 0 12%,#2E5FA3 12% 24%,#8C3B2E 24% 36%,
      #3F6E4B 36% 48%,#7A5EA8 48% 60%,#B8791E 60% 72%,#2A2A28 72% 84%,#D8D5CC 84% 100%);
    opacity:.8;
  }
  #gate h1{font-size:15px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;margin:14px 0 10px;}
  #gate p{font-size:10px;line-height:1.9;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 18px;text-transform:uppercase;}
  #gate button{width:100%;flex:none;padding:12px;font-size:10px;border:1px solid var(--ink);}
  #err{margin-top:13px;font-size:10px;line-height:1.7;color:#B4472B;letter-spacing:.03em;text-transform:none;display:none;}

  #flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:50;}
  #toast{
    position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:55;
    background:rgba(12,13,16,.92);color:var(--card);font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;padding:9px 14px;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:82%;text-align:center;
  }
  #toast.on{opacity:1;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  @media (min-width:760px){
    #sheet{left:auto;right:20px;bottom:20px;width:440px;max-height:80vh;transform:translateY(120%);}
    #sheet.on{transform:translateY(0);}
  }
</style>
</head>
<body>

<canvas id="stage" class="stage"></canvas>
<canvas id="gl" class="stage"></canvas>
<iframe id="host" allow="camera;microphone" referrerpolicy="no-referrer"></iframe>
<video id="vid" playsinline autoplay muted></video>
<div id="flash"></div>

<div id="hud">
  <div class="stack">
    <p class="n" id="hName">—</p>
    <p class="sub" id="hSub">swipe to change camera</p>
  </div>
  <span id="recDot"><i></i><span id="recTime">0:00</span></span>
</div>

<div id="nav"><button id="navPrev">‹</button><span id="navName">—</span><button id="navRack">Rack</button><button id="navNext">›</button></div>
<div id="pips"></div>

<div id="deck">
  <button class="tab" id="bSetup">Setup</button>
  <button id="bShot" aria-label="Snapshot"></button>
  <button id="bRec" aria-label="Record video"></button>
</div>

<div id="scrim"></div>

<div id="sheet">
  <div id="rack"></div>
  <p id="camName">—</p>
  <p id="camLine">—</p>
  <div id="ctrls"></div>
  <div class="hr"></div>
  <div class="field">
    <div class="row">
      <button class="b" id="bHold">Hold</button>
      <button class="b" id="bFlip">Flip</button>
      <button class="b" id="bMic">Sound off</button>
      <button class="b on" id="bFmt">MP4</button>
      <button class="b" id="bAspect">Reel 9:16</button>
      <button class="b" id="bLook">Look</button>
      <button class="b" id="bClose">Close</button>
    </div>
  </div>
  <p class="note" id="camNote"></p>
  <div class="credit">
    <a href="https://x.com/minted_i">By Yoshi Babaganoush</a>
    <span>Your camera feed never leaves your device</span>
  </div>
</div>

<div id="toast"></div>

<div id="gate">
  <div class="card">
    <h1>Yoshi Camera</h1>
    <p>Nine cameras that refuse to behave, on one shutter. Swipe the picture to change instrument.</p>
    <button id="bStart">Open the shutter</button>
    <div id="err"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     SHELL — camera, deck, sheet, recording. Shared by every instrument.
     ===================================================================== */
  var vid   = document.getElementById('vid');
  var stage = document.getElementById('stage');
  var ctx   = stage.getContext('2d');
  var glc   = document.getElementById('gl');
  var gate  = document.getElementById('gate');
  var errEl = document.getElementById('err');
  var flash = document.getElementById('flash');
  var sheet = document.getElementById('sheet');
  var scrim = document.getElementById('scrim');
  var toastEl = document.getElementById('toast');
  var hName = document.getElementById('hName');
  var hSub  = document.getElementById('hSub');
  var rackEl= document.getElementById('rack');
  var ctrlEl= document.getElementById('ctrls');
  var pipsEl= document.getElementById('pips');

  var W=0,H=0,DPR=1;
  var facing='user', stream=null, ready=false, held=false;

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
            function(f){ return setTimeout(f,16); };
  var now = function(){
    return (window.performance && performance.now) ? performance.now() : Date.now();
  };

  function has(op){
    var c=document.createElement('canvas').getContext('2d');
    c.globalCompositeOperation=op;
    return c.globalCompositeOperation===op;
  }
  var canMultiply=has('multiply'), canDifference=has('difference'), canScreen=has('screen'), canHue=has('hue');

  var toastT=null;
  function toast(m){
    toastEl.textContent=m; toastEl.className='on';
    if(toastT) clearTimeout(toastT);
    toastT=setTimeout(function(){ toastEl.className=''; },2600);
  }
  function commas(n){
    var s=String(n),o='',i,c=0;
    for(i=s.length-1;i>=0;i--){ o=s.charAt(i)+o; if(++c%3===0&&i>0) o=','+o; }
    return o;
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function mk(w,h){
    var c=document.createElement('canvas');
    if(w){ c.width=w; c.height=h; }
    return { c:c, x:c.getContext('2d') };
  }

  /* pull a mirrored, cover-cropped frame into any surface */
  function grabInto(o, w, h){
    if(!vid.videoWidth) return false;
    if(o.c.width!==w || o.c.height!==h){ o.c.width=w; o.c.height=h; }
    var vw=vid.videoWidth, vh=vid.videoHeight;
    var vr=vw/vh, cr=w/h, ax=0, ay=0, aw=vw, ah=vh;
    if(vr>cr){ aw=vh*cr; ax=(vw-aw)/2; } else { ah=vw/cr; ay=(vh-ah)/2; }
    o.x.save();
    o.x.globalCompositeOperation='source-over';
    o.x.globalAlpha=1;
    if(facing==='user'){ o.x.translate(w,0); o.x.scale(-1,1); }
    o.x.drawImage(vid, ax,ay,aw,ah, 0,0,w,h);
    o.x.restore();
    return true;
  }

  /* stretch whatever light is in the room across the full range */
  function makeLeveller(){
    var lo=0, hi=255, on=false, hist=new Int32Array(64);
    return {
      lo:function(){ return lo; },
      hi:function(){ return hi; },
      read:function(px,n){
        var i,o,l,k,cum,t,a=0,b=255;
        for(k=0;k<64;k++) hist[k]=0;
        for(i=0;i<n;i++){
          o=i*4;
          l=(0.2126*px[o]+0.7152*px[o+1]+0.0722*px[o+2])|0;
          hist[l>>2]++;
        }
        t=n*0.04; cum=0;
        for(k=0;k<64;k++){ cum+=hist[k]; if(cum>=t){ a=k*4; break; } }
        t=n*0.04; cum=0;
        for(k=63;k>=0;k--){ cum+=hist[k]; if(cum>=t){ b=k*4+3; break; } }
        if(b-a<24) b=a+24;
        if(b>255){ b=255; a=231; }
        if(!on){ lo=a; hi=b; on=true; } else { lo=lo*0.9+a*0.1; hi=hi*0.9+b*0.1; }
      }
    };
  }

  /* =====================================================================
     THE INSTRUMENTS
     ===================================================================== */
  var CAMS=[];
  function reg(o){ CAMS.push(o); }

  /* ---------------- GAMUT — every colour, exactly once ---------------- */
  (function(){
    function axesToTranspose(X,b){
      var n=3,M=1<<(b-1),P,Q,t,i;
      for(Q=M;Q>1;Q>>=1){ P=Q-1;
        for(i=0;i<n;i++){
          if(X[i]&Q){ X[0]^=P; } else { t=(X[0]^X[i])&P; X[0]^=t; X[i]^=t; }
        }
      }
      for(i=1;i<n;i++) X[i]^=X[i-1];
      t=0;
      for(Q=M;Q>1;Q>>=1){ if(X[n-1]&Q) t^=Q-1; }
      for(i=0;i<n;i++) X[i]^=t;
      return X;
    }
    function transposeToAxes(X,b){
      var n=3,N=2<<(b-1),P,Q,t,i;
      t=X[n-1]>>1;
      for(i=n-1;i>0;i--) X[i]^=X[i-1];
      X[0]^=t;
      for(Q=2;Q!==N;Q<<=1){ P=Q-1;
        for(i=n-1;i>=0;i--){
          if(X[i]&Q){ X[0]^=P; } else { t=(X[0]^X[i])&P; X[0]^=t; X[i]^=t; }
        }
      }
      return X;
    }
    function tIdx(X,b){ var d=0,i,j; for(i=b-1;i>=0;i--) for(j=0;j<3;j++) d=d*2+((X[j]>>>i)&1); return d; }
    function idxT(d,b){
      var X=[0,0,0],i,j,p;
      for(i=b-1;i>=0;i--) for(j=0;j<3;j++){ p=3*b-1-((b-1-i)*3+j); X[j]|=((d>>>p)&1)<<i; }
      return X;
    }
    function hIndex(x,y,z,b){ return tIdx(axesToTranspose([x,y,z],b),b); }
    function hPoint(d,b){ return transposeToAxes(idxT(d,b),b); }

    var LUT=null, small=null, keys=null, out=null, pal=null, palN=0, gw=0, gh=0, bite=null, biteFor=-1;

    function lut(){
      if(LUT) return LUT;
      LUT=new Int32Array(262144);
      var r,g,b;
      for(r=0;r<64;r++) for(g=0;g<64;g++) for(b=0;b<64;b++) LUT[(r<<12)|(g<<6)|b]=hIndex(r,g,b,6);
      return LUT;
    }
    function ensureBite(v){
      if(biteFor===v && bite) return;
      bite=new Uint8Array(256);
      var e=0.8+(v/100)*2.4, i, x;
      for(i=0;i<256;i++){ x=Math.pow(i/255,e)*255; bite[i]=x<6?6:(x>255?255:x|0); }
      biteFor=v;
    }
    function radix(k,n){
      var order=new Int32Array(n), tmp=new Int32Array(n), cnt=new Int32Array(512),i,p,sh,c,s,t,q;
      for(i=0;i<n;i++) order[i]=i;
      for(p=0;p<2;p++){
        sh=p*9;
        for(c=0;c<512;c++) cnt[c]=0;
        for(i=0;i<n;i++) cnt[(k[order[i]]>>>sh)&511]++;
        s=0; for(c=0;c<512;c++){ t=cnt[c]; cnt[c]=s; s+=t; }
        for(i=0;i<n;i++){ q=(k[order[i]]>>>sh)&511; tmp[cnt[q]++]=order[i]; }
        order.set(tmp);
      }
      return order;
    }
    function build(){
      gw=v.grain;
      gh=Math.max(8, Math.round(gw*(H/Math.max(W,1))));
      var n=gw*gh, i, st=16777216/n, p;
      if(!small) small=mk();
      small.c.width=gw; small.c.height=gh;
      out=small.x.createImageData(gw,gh);
      keys=new Int32Array(n);
      pal=new Int32Array(n);
      for(i=0;i<n;i++){ p=hPoint(Math.floor(i*st),8); pal[i]=(p[0]<<16)|(p[1]<<8)|p[2]; }
      palN=n;
      lut();
    }

  (function(){

    }

      if(!srcC) srcC=mk();

      rows=splits(H,v.weft,v.slub/100);

        {t:'sld',k:'n',label:'Ommatidia',min:120,max:7000,rebuild:true},
        {t:'sld',k:'dome',label:'Dome',min:0,max:100,rebuild:true},

  /* ---------------- TROXLER — it cannot see what holds still ---------------- */

  function showHost(c){
    hostedNow=!!c.hosted;
    navEl.className = hostedNow ? 'on' : '';
    document.getElementById('navName').textContent=c.name;
    document.getElementById('pips').style.display = hostedNow ? 'none' : '';

        hostEl.src=c.hosted;
      }

      // same origin lets the shutter reach inside; if not, its own deck serves

      for(i=0;i<4;i++){
        c=corners[i];
        ctx.moveTo(c[0]+c[2]*len,c[1]);
        ctx.lineTo(c[0],c[1]);
        ctx.lineTo(c[0],c[1]+c[3]*len);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- delivery canvas ---------- */
  var recCan=document.createElement('canvas'), recCtx=recCan.getContext('2d');
  var recFmt='mp4', recAspect='reel';
  function setupRecCanvas(){
    var ar=frameRatio(), w, h;
    if(ar>=1){ w=1920; h=Math.round(w/ar); if(h>1080){ h=1080; w=Math.round(h*ar); } }
    else     { h=1920; w=Math.round(h*ar); if(w>1080){ w=1080; h=Math.round(w/ar); } }
    w=Math.max(2,Math.round(w/2)*2); h=Math.max(2,Math.round(h/2)*2);
    if(recCan.width!==w||recCan.height!==h){ recCan.width=w; recCan.height=h; }
  }
  function sourceCanvas(){ return (hostedNow && hostCanvas) ? hostCanvas : stage; }
  function paintRec(){
    var S=sourceCanvas();
    var sw=S.width, sh=S.height, dw=recCan.width, dh=recCan.height;
    if(!sw||!sh||!dw||!dh) return;
    var sr=sw/sh, dr=dw/dh, cx=0, cy=0, cw=sw, ch=sh;
    if(sr>dr){ cw=sh*dr; cx=(sw-cw)/2; } else { ch=sw/dr; cy=(sh-ch)/2; }
    recCtx.imageSmoothingEnabled=true;
    recCtx.drawImage(S,cx,cy,cw,ch,0,0,dw,dh);
  }

  /* ---------- stills ---------- */
  function shutterFlash(){
    flash.style.transition='none'; flash.style.opacity='.8';
    setTimeout(function(){ flash.style.transition='opacity .45s'; flash.style.opacity='0'; },60);
  }
  function saveUrl(url,name){
    var a=document.createElement('a');
    if('download' in a){
      a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } else { window.open(url,'_blank'); }
  }
  document.getElementById('bShot').addEventListener('click', function(){
    shutterFlash();
    var url;
    try { url=sourceCanvas().toDataURL('image/png'); } catch(e){ toast('Could not save'); return; }
    saveUrl(url, CAMS[cur].id+'-'+Date.now()+'.png');
    toast('Still saved');
  });

  /* ---------- video ---------- */
  var recorder=null, chunks=[], recording=false, recStart=0, micOn=false, micStream=null;
  var recBtn=document.getElementById('bRec');
  var recDot=document.getElementById('recDot');
  var recTime=document.getElementById('recTime');
  var MAXMS=5*60*1000;

  function pickMime(withAudio){
    if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var mp4 = withAudio
      ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4']
      : ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4;codecs=h264','video/mp4'];
    var webm = withAudio
      ? ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
      : ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    var list=(recFmt==='webm')?webm.concat(mp4):mp4.concat(webm);
    var i;
    for(i=0;i<list.length;i++) if(MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }
  function tickTime(){
    var s=Math.floor((now()-recStart)/1000);
    recTime.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
    if(now()-recStart>MAXMS) stopRec();
  }
  function startRec(){
    if(!window.MediaRecorder){ toast('This browser cannot record video'); return; }
    setupRecCanvas(); paintRec();
    if(!recCan.captureStream){ toast('This browser cannot record video'); return; }
    var s;
    try { s=recCan.captureStream(30); } catch(e){ toast('Capture failed'); return; }
    var withAudio=!!(micOn&&micStream);
    if(withAudio){
      var at=micStream.getAudioTracks(),i;
      for(i=0;i<at.length;i++) s.addTrack(at[i]);
    }
    var mime=pickMime(withAudio);
    try {
      recorder = mime ? new MediaRecorder(s,{mimeType:mime, videoBitsPerSecond:10000000})
                      : new MediaRecorder(s);
    } catch(e){
      try { recorder=new MediaRecorder(s); }
      catch(e2){ toast('Recorder unavailable'); return; }
    }
    chunks=[];
    recorder.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
    recorder.onstop=function(){
      var type=(recorder&&recorder.mimeType)?recorder.mimeType:(mime||'video/webm');
      var isMp4=type.indexOf('mp4')>-1;
      var blob=new Blob(chunks,{type:isMp4?'video/mp4':'video/webm'});
      chunks=[];
      var url=URL.createObjectURL(blob);
      saveUrl(url, CAMS[cur].id+'-'+Date.now()+'.'+(isMp4?'mp4':'webm'));
      setTimeout(function(){ URL.revokeObjectURL(url); },60000);
      toast(isMp4 ? (recCan.width+'×'+recCan.height+' mp4 saved')
                  : 'Saved as webm — this browser has no mp4 encoder');
    };
    try { recorder.start(1000); }
    catch(e){ toast('Could not start recording'); return; }
    recording=true; recStart=now();
    recBtn.className='on'; recDot.className='on'; recTime.textContent='0:00';
  }
  function stopRec(){
    if(!recording) return;
    recording=false;
    recBtn.className=''; recDot.className='';
    try { recorder.stop(); } catch(e){}
  }
  recBtn.addEventListener('click', function(){ if(recording) stopRec(); else startRec(); });

  document.getElementById('bMic').addEventListener('click', function(){
    var self=this;
    if(micOn){
      micOn=false;
      if(micStream){ var t=micStream.getTracks(),i; for(i=0;i<t.length;i++) t[i].stop(); micStream=null; }
      self.className='b'; self.textContent='Sound off';
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      micStream=s; micOn=true;
      self.className='b on'; self.textContent='Sound on';
    })['catch'](function(){ toast('Microphone refused'); });
  });

  /* ---------- sheet ---------- */
  function openSheet(v2){
    sheet.className=v2?'on':'';
    scrim.className=v2?'on':'';
    document.getElementById('bSetup').className=v2?'tab on':'tab';
  }
  document.getElementById('bSetup').addEventListener('click', function(){ openSheet(sheet.className!=='on'); });
  (function(){
    var lk=document.getElementById('bLook');
    function on(e){ peek(true); if(e.preventDefault) e.preventDefault(); }
    function off(){ peek(false); }
    lk.addEventListener('touchstart',on,false);
    lk.addEventListener('touchend',off,false);
    lk.addEventListener('mousedown',on,false);
    lk.addEventListener('mouseup',off,false);
    lk.addEventListener('mouseleave',off,false);
  })();
  document.getElementById('bClose').addEventListener('click', function(){ openSheet(false); });
  scrim.addEventListener('click', function(){ openSheet(false); });

  document.getElementById('bHold').addEventListener('click', function(){
    held=!held;
    this.className=held?'b on':'b';
    this.textContent=held?'Held':'Hold';
  });
  document.getElementById('bFlip').addEventListener('click', function(){
    facing=(facing==='user')?'environment':'user';
    start();
  });
  document.getElementById('bFmt').addEventListener('click', function(){
    recFmt=(recFmt==='mp4')?'webm':'mp4';
    this.textContent=(recFmt==='mp4')?'MP4':'WebM';
    this.className=(recFmt==='mp4')?'b on':'b';
  });
  document.getElementById('bAspect').addEventListener('click', function(){
    recAspect = (recAspect==='reel')   ? 'square'
              : (recAspect==='square') ? 'wide'
              : (recAspect==='wide')   ? 'screen'
                                       : 'reel';
    this.textContent = recAspect==='reel'   ? 'Reel 9:16'
                     : recAspect==='square' ? 'Square 1:1'
                     : recAspect==='wide'   ? 'Wide 16:9'
                                            : 'Screen';
    setupRecCanvas();
  });

  document.getElementById('bStart').addEventListener('click', start);

  resize();
})();
</script>
</body>
</html>
